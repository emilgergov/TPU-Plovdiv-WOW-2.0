name: KT128 private author transport live check
on:
  push:
    branches: [work/kt125-access-register-from-kt124-r6]
    paths: ['.github/workflows/kt128-author-transport-check.yml']
permissions:
  contents: read
concurrency:
  group: kt125-local97-deployment
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private HTTP and session RPC routing with invalid session only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          const base='https://api.cloudflare.com/client/v4/accounts/90df5489417e4b53179a852c446aeed1',headers={Authorization:'Bearer '+process.env.CF_TOKEN};
          async function api(path,options={}){const r=await fetch(base+path,{...options,headers:{...headers,...options.headers},signal:AbortSignal.timeout(45000)});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error('Cloudflare operation failed '+r.status);return d.result;}
          const native='tpu-plovdiv-kt125-local-auth',helper='kt128-author-check-'+process.env.GITHUB_RUN_ID,key=randomBytes(32).toString('hex');
          const settings=await api('/workers/scripts/'+native+'/settings');if(!settings.bindings.some(b=>b.name==='KT128_AUTHOR'&&b.type==='service'&&b.service==='tpu-plovdiv-ai-author-v27'))throw Error('Private author binding missing');
          let created=false;
          try{
            const source=`export default {async fetch(r,e){if(r.method!=='POST'||r.headers.get('Authorization')!=='Bearer '+e.KEY)return new Response(null,{status:403,headers:{'X-KT128-Check':'ready'}});return Response.json(await e.LOCAL.verifyAuthorTransport());}}`;
            const form=new FormData();form.set('metadata',new Blob([JSON.stringify({main_module:'worker.mjs',compatibility_date:settings.compatibility_date,observability:{enabled:false},bindings:[{name:'KEY',type:'secret_text',text:key},{name:'LOCAL',type:'service',service:native,entrypoint:'LocalAuthService'}]})],{type:'application/json'}));form.set('worker.mjs',new Blob([source],{type:'application/javascript+module'}),'worker.mjs');
            await api('/workers/scripts/'+helper,{method:'PUT',body:form});created=true;
            await api('/workers/scripts/'+helper+'/subdomain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:true,previews_enabled:false})});
            const sub=await api('/workers/subdomain'),url='https://'+helper+'.'+sub.subdomain+'.workers.dev/check';
            let ready=false;for(let i=0;i<20;i++){const r=await fetch(url,{signal:AbortSignal.timeout(10000)});if(r.status===403&&r.headers.get('X-KT128-Check')==='ready'){ready=true;break}await new Promise(r=>setTimeout(r,2000));}if(!ready)throw Error('Private check helper unavailable');
            let result=null;for(let i=0;i<5;i++){await new Promise(r=>setTimeout(r,3000));const r=await fetch(url+'?attempt='+i,{method:'POST',headers:{Authorization:'Bearer '+key},signal:AbortSignal.timeout(30000)});if(!r.ok)continue;result=await r.json();if(result.guarded)break;}
            console.log('KT128_PRIVATE_AUTHOR_TRANSPORT '+JSON.stringify(result));if(!result?.configured||!result.guarded||!result.json||result.status!==403)throw Error('Private author route did not return the expected session guard');
            console.log('NO_PAID_AI_CALL: deliberately invalid session rejected before provider access.');
          }finally{if(created){await api('/workers/scripts/'+helper,{method:'DELETE'});console.log('TEMPORARY_CHECK_REMOVED');}}
          NODE
