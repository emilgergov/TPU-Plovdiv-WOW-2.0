name: KT69 Classic B etalon paragraph audit
on:
  push:
    paths:
      - '.github/workflows/kt69-b-etalon-audit.yml'
      - 'v26-test/v27-preview/v27-kt50-original-kt42.js'
      - 'v26-test/v27-preview/kt69-classic-b-etalon-restore.js'
      - 'v26-test/v27-preview/kt66-locked-content-qa.js'
      - 'v26-test/v27-preview/kt68-map-controls.js'
      - 'v26-test/v27-preview/kt69-classic-b-qa.cjs'
      - 'v26-test/v27-preview/kt67-2-original-word-auto-project-test.html'
      - 'v26-test/v27-preview/kt67-2-5-a-b-admin-test.html'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOCX test dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Test scenario B real DOCX and locked A/Expert isolation
        run: |
          node --check v26-test/v27-preview/kt69-classic-b-etalon-restore.js
          node --check v26-test/v27-preview/kt69-classic-b-qa.cjs
          node v26-test/v27-preview/kt69-classic-b-qa.cjs
      - name: Check public A/B page includes adapter after locked KT50 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['kt67-2-original-word-auto-project-test.html','kt67-2-5-a-b-admin-test.html']:
              s=Path('v26-test/v27-preview',name).read_text()
              original='v27-preview/v27-kt50-original-kt42.js?v=kt603-original-locked-b1d2cfb'
              fix='v27-preview/kt69-classic-b-etalon-restore.js?v=kt71-b-1'
              draft='v27-preview/kt67-2-draft-package.js?v=kt67-2-draft-1'
              assert s.count(fix)==1, name
              assert s.index(original)<s.index(fix)<s.index(draft), name
              assert 'v27-preview/kt68-map-controls.js?v=kt71-compact-1' in s, name
          print('KT69 PASS: B-only adapter follows unchanged KT50 on both pages, map layer retained')
          map_js=Path('v26-test/v27-preview/kt68-map-controls.js').read_text()
          assert 'width:max-content!important' in map_js and 'max-width:min(410px' in map_js
          assert 'justify-content:flex-start!important' in map_js
          assert 'pressedParcel' in map_js and 'showAll.onclick' in map_js and 'showSelected.onclick' in map_js
          print('KT70 PASS: map 500px compact toolbar; cadastral click and both views intact')
          PY
      - name: Audit original 43-paragraph KT39-B with source data untouched
        run: |
          python3 - <<'PY'
          import zipfile,xml.etree.ElementTree as ET,hashlib
          path='v26-test/v27-preview/etalon/KT39-B.docx'
          with open(path,'rb') as f: data=f.read()
          print('KT39-B SHA256:',hashlib.sha256(data).hexdigest())
          with zipfile.ZipFile(path) as z: doc=ET.fromstring(z.read('word/document.xml'))
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          body=doc.find('w:body',ns)
          ps=body.findall('w:p',ns)
          assert len(ps)==43, f'Expected 43 paragraphs, got {len(ps)}'
          for i,p in enumerate(ps):
              text=''.join(n.text or '' for n in p.findall('.//w:t',ns))
              print(f'KT39-B paragraph [{i:02d}]: {text[:580]}')
          PY
