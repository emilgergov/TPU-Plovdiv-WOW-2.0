name: KT132 panel 01 compatibility
on:
  push:
    branches: [work/kt132-panel01]
concurrency:
  group: kt131-isolated-preview
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a9d0bbf2e4f55c902334765bfbfda76a8f81cfc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the accepted gateway to the pilot modules
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {overlayModule} from './cloudflare/kt125-access/src/kt126/gateway.mjs';
          for (const file of ['kt116-expert-approval-handoff.mjs','kt117-stage5-document-author.mjs']) {
            const path = 'vt03/kt80/integration/' + file;
            const input = execFileSync('git',['show',process.env.GITHUB_SHA+':'+path],{encoding:'utf8'});
            const output = overlayModule(path,input);
            execFileSync('node',['--input-type=module','--check'],{input:output});
            assert.ok(output.includes(file.startsWith('kt116')?'panelId:chosen':'panelHandoff'));
            if (file.startsWith('kt117')) assert.ok(output.includes('installPreparedTextEditor'));
          }
          JS
      - run: npm ci --prefix cloudflare/kt125-access
      - name: Build from the accepted release with two pinned pilot modules
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const root='cloudflare/kt125-access/';
          const patchOnce=(source,anchor,replacement)=>{assert.equal(source.split(anchor).length,2,anchor);return source.replace(anchor,replacement);};
          const guidance="Започни от експертно потвърдените предмет и обхват. Разграничи първоначалното ИП, вече издадения документ и текущото искане. Когато се иска преразглеждане, промяна или корекция на вече издадено писмо, мотивирай административното действие по текущото искане и разгледай панел №17 според каталога. Позоваването на чл. 2, ал. 2 в оспорваното писмо само по себе си не обосновава издаването на ново първоначално писмо по панел №01. Четирите нормативни теста остават съпоставка по основното ИП. Не предрешавай дали искането ще бъде уважено.";
          const qualification='cloudflare/ai-author-v27/src/kt123-evidence-qualification.mjs';
          let authorSource=readFileSync(qualification,'utf8');
          authorSource=patchOnce(authorSource,' "Върни точно ЧЕТИРИ tests', ' '+JSON.stringify(guidance)+',\n "Върни точно ЧЕТИРИ tests');
          writeFileSync(qualification,authorSource);
          const authorWorker='cloudflare/ai-author-v27/src/worker.js';
          authorSource=readFileSync(authorWorker,'utf8');
          authorSource=patchOnce(authorSource,'content:system+(lockedQualification?', 'content:system+" "+'+JSON.stringify(guidance)+'+(lockedQualification?');
          authorSource=patchOnce(authorSource,'  const reviewSystem=[','  const reviewSystem=[\n   '+JSON.stringify(guidance)+',');
          const qualityAnchor='  const heads=sectionNames.map(s=>normalized.indexOf(s.toLocaleLowerCase("bg")));\n  const issues=[];';
          authorSource=patchOnce(authorSource,qualityAnchor,qualityAnchor+'\n'+"  const reviewSubject=/преразглеждане|възражение|жалба/iu.test(String(payload.subject||\"\"));\n  const reviewScope=/(?:преразглеждане|промяна|корекция|оспорване)\\s+на\\s+(?:вече\\s+издаденото\\s+)?писмо(?:то)?/iu.test(String(payload.scope||\"\"));\n  if(reviewSubject&&reviewScope&&/ИЗБРАН\\s+ПАНЕЛ\\s*[:：]\\s*0?1\\b/iu.test(value))\n   issues.push(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\");");
          writeFileSync(authorWorker,authorSource);
          const worker=root+'src/local-auth/worker.mjs';
          let code=readFileSync(worker,'utf8');
          const old="'https://raw.githubusercontent.com/emilgergov/TPU-Plovdiv-WOW-2.0/2652e375cf90f03570a77158335ef364d4a48a5f/'+rel";
          assert.ok(code.includes(old));
          const pinned=process.env.GITHUB_SHA;
          assert.match(pinned,/^[a-f0-9]{40}$/);
          code=code.replace(old,"'https://raw.githubusercontent.com/emilgergov/TPU-Plovdiv-WOW-2.0/'+(['vt03/kt80/integration/kt116-expert-approval-handoff.mjs','vt03/kt80/integration/kt117-stage5-document-author.mjs','vt03/kt80/KT80_E01_KT53_SUBJECT_SCOPE_CONSTRUCTOR_V54.js','vt03/kt80/KT80_E01_IP_MASTER_SUBJECT_V32.js'].includes(rel)?'"+pinned+"':'2652e375cf90f03570a77158335ef364d4a48a5f')+'/'+rel");
          writeFileSync(worker,code);
          const gateway=root+'src/kt126/gateway.mjs';
          code=readFileSync(gateway,'utf8');
          const anchor='  source=replaceOnce(source,"link.href=url;link.download=';
          const index=code.indexOf(anchor);
          assert.ok(index>0);
          const success="   }catch(e){status.textContent='Неуспешно генериране:";
          code=code.slice(0,index)+"  source=replaceOnce(source,"+JSON.stringify(success)+","+JSON.stringify("     return true;\n"+success)+");\n"+code.slice(index);
          writeFileSync(gateway,code);
          for(const f of ['preview/author-entry.mjs','preview/native-entry.mjs','preview/router-entry.mjs']){
            const name=root+f;
            writeFileSync(name,readFileSync(name,'utf8').replaceAll('kt131-tpu-plovdiv-kt125-local-auth','kt132-tpu-plovdiv-kt125-local-auth').replaceAll('КТ131 · ТЕСТОВА ВЕРСИЯ','КТ132 · ТЕСТОВА ВЕРСИЯ'));
          }
          const deployment=root+'deploy/kt131-preview.mjs';
          code=readFileSync(deployment,'utf8')
            .replaceAll("router='kt131-","router='kt132-")
            .replaceAll("'https://kt131-'+native","'https://kt132-'+native")
            .replace("],'kt131');", "],'kt132');")
            .replaceAll('КТ131 · ТЕСТОВА ВЕРСИЯ','КТ132 · ТЕСТОВА ВЕРСИЯ')
            .replaceAll('KT131_PREVIEW_READY','KT132_PREVIEW_READY')
            .replace(" const login=await fetch(origin+'/auth/login');"," const guarded=await fetch(origin+'/module/vt03/kt80/integration/kt117-stage5-document-author.mjs',{redirect:'manual'});if(![302,303,307].includes(guarded.status)||guarded.headers.get('location')!=='/auth/login')throw Error('Pilot module is not session guarded');\n const login=await fetch(origin+'/auth/login');");
          for(const [service,stable,version] of [['author','authorStable','authorVersion'],['native','nativeStable','nativeVersion']]){
            const prior=service+'Before.versions.map(({version_id,percentage})=>({version_id,percentage}))';
            // Replace the old preview allocation. Restore it on failure.
            code=code.replace('versions:[{version_id:'+stable+',percentage:100}]','versions:'+prior);
          }
          writeFileSync(deployment,code);
          JS
          mkdir -p dist
          cloudflare/kt125-access/node_modules/.bin/esbuild cloudflare/kt125-access/preview/author-entry.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=dist/kt131-author-preview.mjs
          cloudflare/kt125-access/node_modules/.bin/esbuild cloudflare/kt125-access/preview/native-entry.mjs --bundle --platform=neutral --format=esm --target=es2022 '--external:node:*' '--external:cloudflare:*' --outfile=dist/kt131-native-preview.mjs
          cloudflare/kt125-access/node_modules/.bin/esbuild cloudflare/kt125-access/preview/router-entry.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=dist/kt131-router.mjs
      - name: Prepare the protected KT132 preview
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/kt125-access/deploy/kt131-preview.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kt132-protected-preview
          path: kt131-preview-qa
