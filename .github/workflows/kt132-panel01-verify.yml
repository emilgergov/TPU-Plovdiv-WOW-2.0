name: KT132 panel 01 compatibility
on:
  push:
    branches: [work/kt132-panel01]
concurrency:
  group: kt131-isolated-preview
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a9d0bbf2e4f55c902334765bfbfda76a8f81cfc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the accepted gateway to the pilot modules
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {overlayModule} from './cloudflare/kt125-access/src/kt126/gateway.mjs';
          for (const file of ['kt116-expert-approval-handoff.mjs','kt117-stage5-document-author.mjs']) {
            const path = 'vt03/kt80/integration/' + file;
            const input = execFileSync('git',['show',process.env.GITHUB_SHA+':'+path],{encoding:'utf8'});
            const output = overlayModule(path,input);
            execFileSync('node',['--input-type=module','--check'],{input:output});
            assert.ok(output.includes(file.startsWith('kt116')?'panelId:chosen':'panelHandoff'));
            if (file.startsWith('kt117')) assert.ok(output.includes('installPreparedTextEditor'));
          }
          JS
      - run: npm ci --prefix cloudflare/kt125-access
      - name: Build from the accepted release with two pinned pilot modules
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const root='cloudflare/kt125-access/';
          const patchOnce=(source,anchor,replacement)=>{assert.equal(source.split(anchor).length,2,anchor);return source.replace(anchor,replacement);};
          const guidance="Започни от експертно потвърдените предмет и обхват. Разграничи първоначалното ИП, вече издадения документ и текущото искане. Когато се иска преразглеждане, промяна или корекция на вече издадено писмо, мотивирай административното действие по текущото искане и разгледай панел №17 според каталога. Позоваването на чл. 2, ал. 2 в оспорваното писмо само по себе си не обосновава издаването на ново първоначално писмо по панел №01. Четирите нормативни теста остават съпоставка по основното ИП. При разлика между имотите в първоначалното уведомление и имотите в издаденото писмо свържи всеки списък с неговия документ. Провери дали писмото се позовава на междинна допълнителна информация. Ако тя не е в преписката, отбележи липсата и запази открит въпроса защо обхватът се различава. Изведи мотивирания панел в самия раздел ИЗБРАН ПАНЕЛ, а не само в бележките на рецензента. Не предрешавай дали искането ще бъде уважено. Ако gisAnalysis.applicability или gisEvidence.applicability е NOT_REQUIRED и expertConfirmed е true, ГИС и PDF1 не се изискват за текущото искане и отсъствието им не е доказателствена липса.";
          const qualification='cloudflare/ai-author-v27/src/kt123-evidence-qualification.mjs';
          let authorSource=readFileSync(qualification,'utf8');
          authorSource=patchOnce(authorSource,' "Върни точно ЧЕТИРИ tests', ' '+JSON.stringify(guidance)+',\n "Върни точно ЧЕТИРИ tests');
          authorSource=patchOnce(authorSource,' const laws=legalProvisions.map('," if(gis?.applicability===\"NOT_REQUIRED\"&&gis.expertConfirmed===true)\n  facts.push({id:\"gis-applicability\",text:\"По експертно потвърдения маршрут ГИС и PDF1 не се изискват. \"+String(gis.reason||\"\"),established:true,kind:\"expert-confirmed-route\"});"+'\n const laws=legalProvisions.map(');
          writeFileSync(qualification,authorSource);
          const authorWorker='cloudflare/ai-author-v27/src/worker.js';
          authorSource=readFileSync(authorWorker,'utf8');
          authorSource=patchOnce(authorSource,'content:system+(lockedQualification?', 'content:system+" "+'+JSON.stringify(guidance)+'+(lockedQualification?');
          authorSource=patchOnce(authorSource,'  const reviewSystem=[','  const reviewSystem=[\n   '+JSON.stringify(guidance)+',');
          const qualityAnchor='  const heads=sectionNames.map(s=>normalized.indexOf(s.toLocaleLowerCase("bg")));\n  const issues=[];';
          authorSource=patchOnce(authorSource,qualityAnchor,qualityAnchor+'\n'+"  const reviewSubject=/преразглеждане|възражение|жалба/iu.test(String(payload.subject||\"\"));\n  const reviewScope=/(?:преразглеждане|промяна|корекция|оспорване)\\s+на\\s+(?:вече\\s+издаденото\\s+)?писмо(?:то)?/iu.test(String(payload.scope||\"\"));\n  if(reviewSubject&&reviewScope&&/ИЗБРАН\\s+ПАНЕЛ\\s*[:：]\\s*0?1\\b/iu.test(value))\n   issues.push(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\");");
          const sourceAnchor=' const qualificationSources=buildQualificationSources(';
          authorSource=patchOnce(authorSource,sourceAnchor," const reviewOfIssuedLetter=/преразглеждане|възражение|жалба/iu.test(String(payload.subject||\"\"))&&/(?:преразглеждане|промяна|корекция|оспорване)\\s+на\\s+(?:вече\\s+издаденото\\s+)?писмо(?:то)?/iu.test(String(payload.scope||\"\"));\n const validateCurrentRequest=(q,sources)=>reviewOfIssuedLetter&&Number(q?.selectedPanel)===1?\n  {ok:false,errors:[\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\"]}:validateQualification(q,sources);"+'\n'+sourceAnchor);
          for(const result of ['q','candidate']){
            const anchor='validateQualification('+result+',qualificationSources)';
            authorSource=patchOnce(authorSource,anchor,'validateCurrentRequest('+result+',qualificationSources)');
          }
          authorSource=patchOnce(authorSource,'       "Свери основанията и не въвеждай недоказано предположение."', '       code==="PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST"?guidancePlaceholder: "Свери основанията и не въвеждай недоказано предположение."'.replace('guidancePlaceholder',JSON.stringify(guidance)));
          authorSource=patchOnce(authorSource,"if(issues.length)return expertPreview(\"Проектът изисква експертен преглед на нормативните несъответствия.\",issues,\"author_repair\",draft,{authorRepairs});","if(issues.length&&!issues.includes(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\"))return expertPreview(\"Проектът изисква експертен преглед на нормативните несъответствия.\",issues,\"author_repair\",draft,{authorRepairs});");
          authorSource=patchOnce(authorSource,"error:reason,caseId:payload.caseId,evidenceRevision:payload.evidenceRevision,","error:codes.includes(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\")?\"Проектът предлага ново първоначално писмо вместо произнасяне по текущото искане за преразглеждане.\":reason,caseId:payload.caseId,evidenceRevision:payload.evidenceRevision,");
          authorSource=patchOnce(authorSource,'unverifiedDraft:typeof proposal==="string"?','unverifiedDraft:!codes.includes("PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST")&&typeof proposal==="string"?');
          authorSource=patchOnce(authorSource,"sourceTexts:sourceTexts.slice(0,12).map(x=>({source:x.source,text:x.text.slice(0,2500),truncated:x.truncated||x.text.length>2500})),","sourceTexts, sourceTextCoverage,");
          authorSource=patchOnce(authorSource,"caseDocumentExcerpts:sourceTexts.slice(0,20).map(x=>({source:x.source,text:x.text.slice(0,2500),truncated:x.truncated||x.text.length>2500})),","sourceTexts, sourceTextCoverage,");
          assert.equal(authorSource.split("caseDocumentRecords:documentRecords.slice(0,20),gisEvidence:detail.gis||null,").length,3);
          authorSource=authorSource.replaceAll("caseDocumentRecords:documentRecords.slice(0,20),gisEvidence:detail.gis||null,","caseDocumentRecords:documentRecords,gisEvidence:detail.gis||null,");
          authorSource=patchOnce(authorSource," const documentRecords="," const sourceTextCoverage={available:Number(detail.sourceTextCount)||0, included:sourceTexts.length, incomplete:detail.sourceTextTruncated===true||sourceTexts.length!==(Number(detail.sourceTextCount)||0)||sourceTexts.some(d=>d.truncated||d.totalChars>d.text.length)};\n const documentRecords=");
          authorSource=patchOnce(authorSource,"sourceTextTruncated:detail.sourceTextTruncated===true,","sourceTextTruncated:sourceTextCoverage.incomplete,");
          authorSource=patchOnce(authorSource,"   sourceTexts,sourceTextCount:","   sourceTexts,sourceTextCoverage,sourceTextCount:");
          authorSource=patchOnce(authorSource,'.sourceTexts.slice(0,60).map(d=>({','.sourceTexts.map(d=>({');
          authorSource=patchOnce(authorSource,'text:text(d?.text,16000)','text:typeof d?.text==="string"?d.text:""');
          writeFileSync('cloudflare/ai-author-v27/src/kt132-normative-lookup.mjs',"import {providerFetch} from './kt131-provider-transport.mjs';\nimport {getFullV11Document,V11_CORPUS_FILES} from './legal-v11-loader.mjs';\n\nconst tools=[\n {type:'function',name:'list_normative_sources',description:'Покажи идентификаторите на документите от нормативния архив V11.',parameters:{type:'object',properties:{},additionalProperties:false},strict:true},\n {type:'function',name:'read_normative_source',description:'Прочети документ от V11 на части. Започни с offset 0 и използвай nextOffset за продължение.',parameters:{type:'object',properties:{id:{type:'string',enum:[...V11_CORPUS_FILES]},offset:{type:'integer'}},required:['id','offset'],additionalProperties:false},strict:true}\n];\n\nasync function lookup(call){\n try{\n  if(call.name==='list_normative_sources')return {sourceIds:V11_CORPUS_FILES};\n  const {id,offset}=JSON.parse(call.arguments);\n  if(call.name!=='read_normative_source'||!V11_CORPUS_FILES.includes(id)||!Number.isSafeInteger(offset)||offset<0)return {error:'Невалидна справка.'};\n  const source=await getFullV11Document(id);\n  if(offset>=source.text.length)return {error:'Началната позиция е извън документа.'};\n  const text=source.text.slice(offset,offset+6000);\n  const end=offset+text.length;\n  return {id,offset,text,nextOffset:end<source.text.length?end:null};\n }catch{return {error:'Източникът временно не е достъпен.'};}\n}\n\nexport async function fetchWithNormativeArchive(url,options,send=providerFetch){\n const payload=JSON.parse(options.body);\n if(payload.tools||!Array.isArray(payload.input))return send(url,options);\n const input=[...payload.input];\n for(let round=0;round<=3;round++){\n  const response=await send(url,{...options,body:JSON.stringify({...payload,input,tools,tool_choice:round===3?'none':'auto',parallel_tool_calls:false})});\n  if(!response.ok)return response;\n  const data=await response.clone().json().catch(()=>null);\n  const calls=data?.output?.filter(item=>item.type==='function_call')||[];\n  if(!calls.length)return response;\n  if(round===3)return new Response(JSON.stringify({error:'Normative archive lookup did not complete'}),{status:502,headers:{'Content-Type':'application/json'}});\n  input.push(...data.output);\n  for(const call of calls)input.push({type:'function_call_output',call_id:call.call_id,output:JSON.stringify(await lookup(call))});\n }\n}\n");
          authorSource=patchOnce(authorSource,"import {providerFetch,replyProviderFailure} from './kt131-provider-transport.mjs';","import {replyProviderFailure} from './kt131-provider-transport.mjs';\nimport {fetchWithNormativeArchive as providerFetch} from './kt132-normative-lookup.mjs';");
          writeFileSync(authorWorker,authorSource);
          const worker=root+'src/local-auth/worker.mjs';
          let code=readFileSync(worker,'utf8');
          const old="'https://raw.githubusercontent.com/emilgergov/TPU-Plovdiv-WOW-2.0/2652e375cf90f03570a77158335ef364d4a48a5f/'+rel";
          assert.ok(code.includes(old));
          const pinned=process.env.GITHUB_SHA;
          assert.match(pinned,/^[a-f0-9]{40}$/);
          code=code.replace(old,"'https://raw.githubusercontent.com/emilgergov/TPU-Plovdiv-WOW-2.0/'+(['vt03/kt80/integration/kt116-expert-approval-handoff.mjs','vt03/kt80/integration/kt117-stage5-document-author.mjs','vt03/kt80/KT80_E01_KT53_SUBJECT_SCOPE_CONSTRUCTOR_V54.js','vt03/kt80/KT80_E01_IP_MASTER_SUBJECT_V32.js'].includes(rel)?'"+pinned+"':'2652e375cf90f03570a77158335ef364d4a48a5f')+'/'+rel");
          writeFileSync(worker,code);
          const gateway=root+'src/kt126/gateway.mjs';
          code=readFileSync(gateway,'utf8');
          const anchor='  source=replaceOnce(source,"link.href=url;link.download=';
          const index=code.indexOf(anchor);
          assert.ok(index>0);
          const success="   }catch(e){status.textContent='Неуспешно генериране:";
          code=code.slice(0,index)+"  source=replaceOnce(source,"+JSON.stringify(success)+","+JSON.stringify("     return true;\n"+success)+");\n"+code.slice(index);
          const stage4OverlayAnchor=' source=overlayPresentationPolish(rel,overlaySpatialHandoff(rel,source));';
          code=patchOnce(code,stage4OverlayAnchor,stage4OverlayAnchor+'\n'+" if(rel.endsWith('/kt96-eg-ai-stage4-author.mjs')){\n  source=replaceOnce(source,\"  const budgets={documents:49000,pageText:15000};\\n  let remaining=budgets.documents;\",\"  const budgets={pageText:15000};\");\n  source=replaceOnce(source,\"  const sourceTexts=documents.slice(0,60).map(d=>{\",\"  const sourceTexts=documents.map(d=>{\");\n  source=replaceOnce(source,\"   const raw=str(d?.text),length=Math.min(remaining,16000,raw.length);\\n   const excerpt=raw.slice(0,length);\\n   remaining-=length;\\n   return {source,text:excerpt,totalChars:raw.length,truncated:length<raw.length,\",\"   const raw=str(d?.text);\\n   return {source,text:raw,totalChars:raw.length,truncated:d?.truncated===true,\");\n  source=replaceOnce(source,\"   else if(d.sourceTexts?.some(x=>x.text.length>500)){\\n    const items=[...d.sourceTexts].sort((a,b)=>b.text.length-a.text.length);\\n    const largest=items[0];const take=Math.max(500,Math.floor(largest.text.length/2));\\n    largest.text=largest.text.slice(0,take);largest.truncated=true;\\n    d.sourceTextTruncated=true;changed=true;\\n   }\",\"\");\n  source=replaceOnce(source,\"Доказателственият пакет е твърде голям и не може да бъде изпратен безопасно. Размер: \",\"Пълният документален текст надхвърля лимита на една заявка. Проект не е поискан. Размер: \");\n }");
          code=patchOnce(code,stage4OverlayAnchor,stage4OverlayAnchor+'\n'+" if(rel.endsWith('/kt96-eg-ai-stage4-author.mjs')){\n  source=replaceOnce(source,\" const spatial=window.KT83NormativeBridge?.getEvidence?.()||{};\",\"  if(confirmedNoGis()){\\n   evidenceBox.append(line('Етап 3 · ГИС','Не се изисква по потвърдения маршрут. PDF1 не се изисква.'));\\n   return;\\n  }\\n\"+\" const spatial=window.KT83NormativeBridge?.getEvidence?.()||{};\");\n  source=replaceOnce(source,\"  const activityTicket=window.KT80Busy?.start?.(\",\"  const noGis=confirmedNoGis();\\n  if(noGis){\\n   request.parcelIds=[];\\n   request.evidence=request.evidence.filter(item=>!['parcel_identifiers_confirmed','pdf1_created','spatial_intersection'].includes(item.factId));\\n   request.completeCaseEvidence.gis={applicability:'NOT_REQUIRED',expertConfirmed:true,reason:str(noGis.reason)};\\n  }\\n\"+\"  const activityTicket=window.KT80Busy?.start?.(\");\n  source=replaceOnce(source,\" const button=make('button','Изготви проект с EG Автора');\",\" function confirmedNoGis(){const gate=window.KT80WorkflowState?.normativeGate;return gate?.expertConfirmed===true&&gate.decision==='NOT_REQUIRED'?gate:null;}\\n\"+\" const button=make('button','Изготви проект с EG Автора');\");\n }");
          code=patchOnce(code,stage4OverlayAnchor,stage4OverlayAnchor+'\n'+" if(rel.endsWith('/kt96-eg-ai-stage4-author.mjs'))source=replaceOnce(source,\"     document.dispatchEvent(new CustomEvent('kt124:stage4-attempt',{detail:{\",\"     if(!str(data.unverifiedDraft))document.dispatchEvent(new CustomEvent('kt132:stage4-rejected',{detail:{caseId:h.caseId,evidenceRevision:h.evidenceRevision}}));\\n     document.dispatchEvent(new CustomEvent('kt124:stage4-attempt',{detail:{\");\n if(rel.endsWith('/kt116-expert-approval-handoff.mjs'))source=replaceOnce(source,\" function clear(){\",\" document.addEventListener('kt132:stage4-rejected',event=>{\\n  const currentEvidence=evidence();\\n  if(!approved&&event.detail?.caseId===currentEvidence.caseId&&event.detail.evidenceRevision===currentEvidence.evidenceRevision)clear();\\n });\\n function clear(){\");");
          writeFileSync(gateway,code);
          for(const f of ['preview/author-entry.mjs','preview/native-entry.mjs','preview/router-entry.mjs']){
            const name=root+f;
            writeFileSync(name,readFileSync(name,'utf8').replaceAll('kt131-tpu-plovdiv-kt125-local-auth','kt132-tpu-plovdiv-kt125-local-auth').replaceAll('КТ131 · ТЕСТОВА ВЕРСИЯ','КТ132 · ТЕСТОВА ВЕРСИЯ'));
          }
          const deployment=root+'deploy/kt131-preview.mjs';
          code=readFileSync(deployment,'utf8')
            .replaceAll("router='kt131-","router='kt132-")
            .replaceAll("'https://kt131-'+native","'https://kt132-'+native")
            .replace("],'kt131');", "],'kt132');")
            .replaceAll('КТ131 · ТЕСТОВА ВЕРСИЯ','КТ132 · ТЕСТОВА ВЕРСИЯ')
            .replaceAll('KT131_PREVIEW_READY','KT132_PREVIEW_READY')
            .replace(" const login=await fetch(origin+'/auth/login');"," const guarded=await fetch(origin+'/module/vt03/kt80/integration/kt117-stage5-document-author.mjs',{redirect:'manual'});if(![302,303,307].includes(guarded.status)||guarded.headers.get('location')!=='/auth/login')throw Error('Pilot module is not session guarded');\n const login=await fetch(origin+'/auth/login');");
          for(const [service,stable,version] of [['author','authorStable','authorVersion'],['native','nativeStable','nativeVersion']]){
            const prior=service+'Before.versions.map(({version_id,percentage})=>({version_id,percentage}))';
            // Replace the old preview allocation. Restore it on failure.
            code=code.replace('versions:[{version_id:'+stable+',percentage:100}]','versions:'+prior);
          }
          writeFileSync(deployment,code);
          JS
          mkdir -p dist
          cloudflare/kt125-access/node_modules/.bin/esbuild cloudflare/kt125-access/preview/author-entry.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=dist/kt131-author-preview.mjs
          cloudflare/kt125-access/node_modules/.bin/esbuild cloudflare/kt125-access/preview/native-entry.mjs --bundle --platform=neutral --format=esm --target=es2022 '--external:node:*' '--external:cloudflare:*' --outfile=dist/kt131-native-preview.mjs
          cloudflare/kt125-access/node_modules/.bin/esbuild cloudflare/kt125-access/preview/router-entry.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=dist/kt131-router.mjs
      - name: Prepare the protected KT132 preview
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/kt125-access/deploy/kt131-preview.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kt132-protected-preview
          path: kt131-preview-qa
