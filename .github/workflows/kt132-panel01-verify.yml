name: KT132 panel 01 compatibility
on:
  push:
    branches: [work/kt132-panel01]
concurrency:
  group: kt131-isolated-preview
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a9d0bbf2e4f55c902334765bfbfda76a8f81cfc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the accepted gateway to the pilot modules
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {overlayModule} from './cloudflare/kt125-access/src/kt126/gateway.mjs';
          for (const file of ['kt116-expert-approval-handoff.mjs','kt117-stage5-document-author.mjs']) {
            const path = 'vt03/kt80/integration/' + file;
            const input = execFileSync('git',['show',process.env.GITHUB_SHA+':'+path],{encoding:'utf8'});
            const output = overlayModule(path,input);
            execFileSync('node',['--input-type=module','--check'],{input:output});
            assert.ok(output.includes(file.startsWith('kt116')?'panelId:chosen':'panelHandoff'));
            if (file.startsWith('kt117')) assert.ok(output.includes('installPreparedTextEditor'));
          }
          JS
      - run: npm ci --prefix cloudflare/kt125-access
      - name: Build from the accepted release with two pinned pilot modules
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const root='cloudflare/kt125-access/';
          const patchOnce=(source,anchor,replacement)=>{assert.equal(source.split(anchor).length,2,anchor);return source.replace(anchor,replacement);};
          const guidance="Започни от експертно потвърдените предмет и обхват. Разграничи първоначалното ИП, вече издадения документ и текущото искане. Когато се иска преразглеждане, промяна или корекция на вече издадено писмо, мотивирай административното действие по текущото искане и разгледай панел №17 според каталога. Позоваването на чл. 2, ал. 2 в оспорваното писмо само по себе си не обосновава издаването на ново първоначално писмо по панел №01. Четирите нормативни теста остават съпоставка по основното ИП. При разлика между имотите в първоначалното уведомление и имотите в издаденото писмо свържи всеки списък с неговия документ. Провери дали писмото се позовава на междинна допълнителна информация. Ако тя не е в преписката, отбележи липсата и запази открит въпроса защо обхватът се различава. Изведи мотивирания панел в самия раздел ИЗБРАН ПАНЕЛ, а не само в бележките на рецензента. Не предрешавай дали искането ще бъде уважено. Ако gisAnalysis.applicability или gisEvidence.applicability е NOT_REQUIRED и expertConfirmed е true, ГИС и PDF1 не се изискват за текущото искане и отсъствието им не е доказателствена липса.";
          const qualification='cloudflare/ai-author-v27/src/kt123-evidence-qualification.mjs';
          let authorSource=readFileSync(qualification,'utf8');
          authorSource=patchOnce(authorSource,' "Върни точно ЧЕТИРИ tests', ' '+JSON.stringify(guidance)+',\n "Върни точно ЧЕТИРИ tests');
          authorSource=patchOnce(authorSource,' const laws=legalProvisions.map('," if(gis?.applicability===\"NOT_REQUIRED\"&&gis.expertConfirmed===true)\n  facts.push({id:\"gis-applicability\",text:\"По експертно потвърдения маршрут ГИС и PDF1 не се изискват. \"+String(gis.reason||\"\"),established:true,kind:\"expert-confirmed-route\"});"+'\n const laws=legalProvisions.map(');
          writeFileSync(qualification,authorSource);
          const authorWorker='cloudflare/ai-author-v27/src/worker.js';
          authorSource=readFileSync(authorWorker,'utf8');
          authorSource=patchOnce(authorSource,'content:system+(lockedQualification?', 'content:system+" "+'+JSON.stringify(guidance)+'+(lockedQualification?');
          authorSource=patchOnce(authorSource,'  const reviewSystem=[','  const reviewSystem=[\n   '+JSON.stringify(guidance)+',');
          const qualityAnchor='  const heads=sectionNames.map(s=>normalized.indexOf(s.toLocaleLowerCase("bg")));\n  const issues=[];';
          authorSource=patchOnce(authorSource,qualityAnchor,qualityAnchor+'\n'+"  const reviewSubject=/преразглеждане|възражение|жалба/iu.test(String(payload.subject||\"\"));\n  const reviewScope=/(?:преразглеждане|промяна|корекция|оспорване)\\s+на\\s+(?:вече\\s+издаденото\\s+)?писмо(?:то)?/iu.test(String(payload.scope||\"\"));\n  if(reviewSubject&&reviewScope&&/ИЗБРАН\\s+ПАНЕЛ\\s*[:：]\\s*0?1\\b/iu.test(value))\n   issues.push(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\");");
          const sourceAnchor=' const qualificationSources=buildQualificationSources(';
          authorSource=patchOnce(authorSource,sourceAnchor," const reviewOfIssuedLetter=/преразглеждане|възражение|жалба/iu.test(String(payload.subject||\"\"))&&/(?:преразглеждане|промяна|корекция|оспорване)\\s+на\\s+(?:вече\\s+издаденото\\s+)?писмо(?:то)?/iu.test(String(payload.scope||\"\"));\n const validateCurrentRequest=(q,sources)=>reviewOfIssuedLetter&&Number(q?.selectedPanel)===1?\n  {ok:false,errors:[\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\"]}:validateQualification(q,sources);"+'\n'+sourceAnchor);
          for(const result of ['q','candidate']){
            const anchor='validateQualification('+result+',qualificationSources)';
            authorSource=patchOnce(authorSource,anchor,'validateCurrentRequest('+result+',qualificationSources)');
          }
          authorSource=patchOnce(authorSource,'       "Свери основанията и не въвеждай недоказано предположение."', '       code==="PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST"?guidancePlaceholder: "Свери основанията и не въвеждай недоказано предположение."'.replace('guidancePlaceholder',JSON.stringify(guidance)));
          authorSource=patchOnce(authorSource,"if(issues.length)return expertPreview(\"Проектът изисква експертен преглед на нормативните несъответствия.\",issues,\"author_repair\",draft,{authorRepairs});","if(issues.length&&!issues.includes(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\"))return expertPreview(\"Проектът изисква експертен преглед на нормативните несъответствия.\",issues,\"author_repair\",draft,{authorRepairs});");
          authorSource=patchOnce(authorSource,"error:reason,caseId:payload.caseId,evidenceRevision:payload.evidenceRevision,","error:codes.includes(\"PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST\")?\"Проектът предлага ново първоначално писмо вместо произнасяне по текущото искане за преразглеждане.\":reason,caseId:payload.caseId,evidenceRevision:payload.evidenceRevision,");
          authorSource=patchOnce(authorSource,'unverifiedDraft:typeof proposal==="string"?','unverifiedDraft:!codes.includes("PANEL_01_DOES_NOT_ADDRESS_CURRENT_REVIEW_REQUEST")&&typeof proposal==="string"?');
          authorSource=patchOnce(authorSource,"sourceTexts:sourceTexts.slice(0,12).map(x=>({source:x.source,text:x.text.slice(0,2500),truncated:x.truncated||x.text.length>2500})),","sourceTexts, sourceTextCoverage,");
          authorSource=patchOnce(authorSource,"caseDocumentExcerpts:sourceTexts.slice(0,20).map(x=>({source:x.source,text:x.text.slice(0,2500),truncated:x.truncated||x.text.length>2500})),","sourceTexts, sourceTextCoverage,");
          assert.equal(authorSource.split("caseDocumentRecords:documentRecords.slice(0,20),gisEvidence:detail.gis||null,").length,3);
          authorSource=authorSource.replaceAll("caseDocumentRecords:documentRecords.slice(0,20),gisEvidence:detail.gis||null,","caseDocumentRecords:documentRecords,gisEvidence:detail.gis||null,");
          authorSource=patchOnce(authorSource," const documentRecords="," const sourceTextCoverage={available:Number(detail.sourceTextCount)||0, included:sourceTexts.length, incomplete:detail.sourceTextTruncated===true||sourceTexts.length!==(Number(detail.sourceTextCount)||0)||sourceTexts.some(d=>d.truncated||d.totalChars>d.text.length)};\n const documentRecords=");
          authorSource=patchOnce(authorSource,"sourceTextTruncated:detail.sourceTextTruncated===true,","sourceTextTruncated:sourceTextCoverage.incomplete,");
          authorSource=patchOnce(authorSource,"   sourceTexts,sourceTextCount:","   sourceTexts,sourceTextCoverage,sourceTextCount:");
          authorSource=patchOnce(authorSource,'.sourceTexts.slice(0,60).map(d=>({','.sourceTexts.map(d=>({');
          authorSource=patchOnce(authorSource,'text:text(d?.text,16000)','text:typeof d?.text==="string"?d.text:""');
          writeFileSync('cloudflare/ai-author-v27/src/kt132-pi-master-index.mjs',"/* KT77-03 — read-only PI MASTER browser lookup (NOT activated until complete validated export).\n   Fail closed: a missing or invalid shard NEVER means parcel outside protected areas.\n   This file does not alter the original R13 GIS/map/document generators. */\nexport const createPiMasterIndex=(function(scope){\n\"use strict\";\nconst manifestName=\"manifest.json\";\nconst sha=async bytes=>{\n if(!scope.crypto?.subtle)throw Error(\"SHA-256 verification unavailable\");\n const h=new Uint8Array(await scope.crypto.subtle.digest(\"SHA-256\",bytes));\n return Array.from(h,b=>b.toString(16).padStart(2,\"0\")).join(\"\");\n};\nasync function unzip(bytes){\n if(typeof scope.DecompressionStream!==\"function\")throw Error(\"Gzip decompression unavailable\");\n const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream(\"gzip\"));\n return JSON.parse(await new Response(stream).text());\n}\nfunction create(base){\n const baseURL=new URL(base,scope.location?.href||\"https://invalid.example/\").href.replace(/\\/?$/,\"/\");\n let manifest=null, lastPrefix=null,lastRows=null;\n async function readJSON(name){\n  const response=await fetch(new URL(name,baseURL),{cache:\"no-store\"});\n  if(!response.ok)throw Error(\"PI MASTER incomplete: \"+name+\" HTTP \"+response.status);\n  return response.json();\n }\n async function init(){\n  const m=await readJSON(manifestName);\n  if(m.schema!==\"kt77-pi-master-browser-v1\"||m.status!==\"VERIFIED\"||m.parts?.length!==67||m.total_unique_parcels!==917417||m.zz_pairs!==176553||m.zt_pairs!==2746)throw Error(\"PI MASTER manifest not verified\");\n  if(m.parts.some(p=>!/^pi-master-[0-9]{2}\\.json\\.gz$/.test(p.file)||!/^([a-f0-9]{64})$/.test(p.sha256)||!Number.isInteger(p.records)))throw Error(\"PI MASTER manifest has invalid parts\");\n  manifest=m;return {available:true,parcels:m.total_unique_parcels};\n }\n async function lookup(cadnum){\n  if(!manifest)await init();\n  if(typeof cadnum!==\"string\"||!/^\\d{5}\\.\\d+\\.\\d+$/.test(cadnum))throw Error(\"Invalid cadastral identifier\");\n  const prefix=cadnum.slice(0,2);\n  const part=manifest.parts.find(p=>p.file===\"pi-master-\"+prefix+\".json.gz\");\n  if(!part)throw Error(\"PI MASTER missing prefix \"+prefix);\n  if(prefix!==lastPrefix){\n   const response=await fetch(new URL(part.file,baseURL),{cache:\"no-store\"});\n   if(!response.ok)throw Error(\"PI MASTER missing part \"+part.file);\n   const bytes=await response.arrayBuffer();\n   if(await sha(bytes)!==part.sha256)throw Error(\"PI MASTER checksum mismatch \"+part.file);\n   const rows=await unzip(bytes);\n   if(!Array.isArray(rows)||rows.length!==part.records)throw Error(\"PI MASTER count mismatch \"+part.file);\n   lastRows=new Map();\n   for(const row of rows){\n    if(!row||typeof row.cadnum!==\"string\"||lastRows.has(row.cadnum)||!Array.isArray(row.zz)||!Array.isArray(row.zt))throw Error(\"PI MASTER part malformed\");\n    lastRows.set(row.cadnum,row);\n   }\n   lastPrefix=prefix;\n  }\n  const row=lastRows.get(cadnum);\n  if(!row)return {status:\"NOT_IN_VALIDATED_CADASTRE\",cadnum};\n  return {status:\"FOUND\",profile:row};\n }\n return Object.freeze({init,lookup});\n}\nreturn create;\n})(globalThis);\n");
          writeFileSync('cloudflare/ai-author-v27/src/kt132-gis-archive.mjs',"/* V26 approved GIS: read complete deployment ZIP locally; never upload parcel data. */\nexport const createGisArchive=(function(global){'use strict';\nlet entries=null,reader=null,archiveName='',cache=new Map(),hostedRoot=null,hostedManifest=null;\nconst normalize=id=>String(id||'').trim().split('.').slice(0,3).join('.');\nasync function openArchive(file){\n if(!file||!(/\\.zip$/i.test(file.name)))throw Error('Изберете пълния V26 ГИС ZIP пакет.');\n if(!global.zip?.ZipReader){\n  await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/dist/zip.min.js';s.onload=ok;s.onerror=()=>fail(Error('Липсва ZIP библиотеката'));document.head.appendChild(s)});\n }\n const next=new global.zip.ZipReader(new global.zip.BlobReader(file));\n let list;try{list=await next.getEntries()}catch(e){await next.close();throw e}\n const files=list.filter(x=>!x.directory);\n const m=new Map(files.map(x=>[x.filename.split('/').pop(),x]));\n // Full deployment contract: never treat a partially extracted/demonstration ZIP\n // as a validated GIS source. Exact shard filenames are checked, not ZIP size.\n const shards=files.filter(x=>/^(?:parcels|parcelgeom|overlays|overlapgeom)_\\d{2}\\.json\\.gz$/i.test(x.filename.split('/').pop()));\n let manifest;\n try{\n  if(!m.has('manifest.json'))throw Error('Липсва ГИС манифест.');\n  const raw=await m.get('manifest.json').getData(new global.zip.TextWriter());\n  manifest=JSON.parse(raw);\n  if(manifest.status!=='PASS_COUNT_BY_PREFIX'||manifest.parcel_geometry!==917418||manifest.overlap_records_expected!==181154||manifest.shards!==258)\n   throw Error('ГИС манифестът не съответства на одобрения пълен набор.');\n  if(shards.length!==258||new Set(shards.map(x=>x.filename.split('/').pop())).size!==258)\n   throw Error('Непълен ГИС архив: очакват се точно 258 уникални пространствени сегмента.');\n  const prefixes={};\n  for(const kind of ['parcels','parcelgeom','overlays','overlapgeom'])\n   prefixes[kind]=new Set(shards.filter(x=>x.filename.split('/').pop().startsWith(kind+'_')).map(x=>x.filename.split('/').pop().split('_')[1].slice(0,2)));\n  const same=(a,b)=>a.size===b.size&&[...a].every(prefix=>b.has(prefix));\n  if(prefixes.parcels.size!==manifest.parcel_prefixes||!same(prefixes.parcels,prefixes.parcelgeom))\n   throw Error('Непълен ГИС архив: кадастралните и геометричните префикси не съвпадат.');\n  if(!same(prefixes.overlays,prefixes.overlapgeom)||[...prefixes.overlays].some(prefix=>!prefixes.parcels.has(prefix)))\n   throw Error('Непълен ГИС архив: слоевете за пресичания не съответстват на кадастралните префикси.');\n }catch(e){await next.close();throw e}\n if(reader)await reader.close();\n reader=next;entries=m;hostedRoot=null;hostedManifest=manifest;cache.clear();archiveName=file.name;\n return {name:archiveName,files:m.size,shards:258,parcel_geometry:manifest.parcel_geometry};\n}\n/* Python geometry export may contain non-standard NaN numeric literals. Normalize only tokens outside JSON strings. */\nfunction normalizeNonFiniteJson(source){\n let changes=0;\n const text=source.replace(/\"(?:\\\\.|[^\"\\\\])*\"|\\b(?:NaN|Infinity)\\b|-Infinity\\b/g,token=>{\n  if(token[0]==='\"')return token;\n  changes++;return 'null';\n });\n return {text,changes};\n}\nasync function rows(kind,prefix){\n const name=kind+'_'+prefix+'.json.gz',key=name;\n if(cache.has(key))return cache.get(key);\n const entry=entries?.get(name);\n let compressed;\n if(hostedRoot){const response=await fetch(hostedRoot+'/'+name);if(!response.ok)throw Error('ГИС сегмент '+name+': HTTP '+response.status);compressed=new Uint8Array(await response.arrayBuffer());}\n else {if(!entry)return [];compressed=await entry.getData(new global.zip.Uint8ArrayWriter());}\n if(!global.DecompressionStream)throw Error('Този браузър не поддържа gzip разархивиране.');\n const bytes=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();\n let result;try{result=JSON.parse(bytes)}catch(e){const fixed=normalizeNonFiniteJson(bytes);if(!fixed.changes)throw Error('Невалиден JSON в '+name+': '+e.message);try{result=JSON.parse(fixed.text)}catch(second){throw Error('Сегмент '+name+': '+second.message)}console.info('V26 GIS: normalized '+fixed.changes+' non-finite values in '+name)}if(!Array.isArray(result))throw Error('Невалиден формат на сегмент: '+name);cache.set(key,result);return result;\n}\nasync function openHosted(base){\n const root=String(base||'').replace(/\\/$/,'');\n const response=await fetch(root+'/manifest.json',{cache:'no-store'});\n if(!response.ok)throw Error('ГИС сегментите още не са публикувани ('+response.status+').');\n const manifest=await response.json();\n if(manifest.status!=='PASS_COUNT_BY_PREFIX'||manifest.parcel_geometry!==917418||manifest.overlap_records_expected!==181154||manifest.shards!==258)throw Error('Непотвърден ГИС манифест.');\n // HEAD is not a reliable availability test on every static host/proxy.\n // Inspect the first gzip bytes with a bounded GET; never infer a missing file from a HEAD failure.\n const probeUrl=root+'/parcelgeom_36.json.gz';\n let probe;\n try{probe=await fetch(probeUrl,{method:'GET',headers:{Range:'bytes=0-1'},cache:'no-store'});}\n catch(e){throw Error('Неуспешна връзка с ГИС сегмента parcelgeom_36.json.gz: '+String(e?.message||e));}\n if(!probe.ok){probe.body?.cancel?.().catch?.(()=>{});throw Error('ГИС сегмент parcelgeom_36.json.gz не е достъпен (HTTP '+probe.status+'). Проверете адреса и публикуването.');}\n const reader=probe.body?.getReader?.();\n if(!reader)throw Error('Не може да се провери съдържанието на ГИС сегмента.');\n let magic=[];\n try{\n  while(magic.length<2){\n   const part=await reader.read();if(part.done)break;\n   for(let i=0;i<part.value.length&&magic.length<2;i++)magic.push(part.value[i]);\n  }\n }finally{await reader.cancel().catch(()=>{});}\n if(magic[0]!==0x1f||magic[1]!==0x8b)throw Error('Публикуваният ГИС сегмент няма валиден gzip заглавен запис.');\n hostedRoot=root;hostedManifest=manifest;cache.clear();return manifest;\n}\nasync function lookup(ids){\n if(!entries&&!hostedRoot)throw Error('ГИС базата не е заредена.');\n if(!Array.isArray(ids)||ids.length<1||ids.length>100)throw Error('Допустими са 1–100 имота.');\n const wanted=ids.map(input=>({input:String(input),cadnum:normalize(input)}));\n const prefixes=[...new Set(wanted.map(x=>x.cadnum.slice(0,2)))];\n const maps=new Map();\n for(const prefix of prefixes){\n  const [parcels,geoms,overlays,intersections]=await Promise.all(['parcels','parcelgeom','overlays','overlapgeom'].map(k=>rows(k,prefix)));\n  const byId=arr=>{const m=new Map();for(const r of arr){if(!m.has(r[0]))m.set(r[0],[]);m.get(r[0]).push(r)}return m};\n  maps.set(prefix,{parcels:byId(parcels),geoms:byId(geoms),overlays:byId(overlays),intersections:byId(intersections)});\n }\n const results=wanted.map(({input,cadnum})=>{\n  const d=maps.get(cadnum.slice(0,2)),p=d.parcels.get(cadnum)?.[0],g=d.geoms.get(cadnum)||[],o=d.overlays.get(cadnum)||[],inter=d.intersections.get(cadnum)||[];\n  const features=g.filter(r=>r[1]?.type).map((r,i)=>({type:'Feature',properties:{cadnum,source:'V26_APPROVED',part:i},geometry:r[1]}));\n  const overlapFeatures=inter.filter(r=>r[2]?.type).map((r,i)=>({type:'Feature',properties:{cadnum,sitecode:r[1],part:i},geometry:r[2]}));\n  return {input,cadnum,status:features.length?'Намерен':p?'Геометрия липсва':'Не е намерен',settlement:p?.[1]||'',locality:p?.[2]||'',area_m2_source:p?.[3]||0,geojson:{type:'FeatureCollection',features},overlap_geojson:{type:'FeatureCollection',features:overlapFeatures},archived_overlay_records:o.map(r=>({sitecode:r[1],name_bg:r[2],order_no:r[3],dv:r[4],area_ha_source:r[5]})),intersection_verified_outside:!!features.length&&!o.length&&!inter.length&&((!!hostedManifest&&hostedManifest.shards===258)||(!hostedRoot&&!!entries&&['parcels','parcelgeom','overlays','overlapgeom'].every(kind=>entries.has(kind+'_'+cadnum.slice(0,2)+'.json.gz')))),spatial_check_basis:hostedManifest?'Пълен публикуван ГИС набор (258 сегмента), проверени пресичания за кадастралния идентификатор':(!hostedRoot&&entries?'Локален ГИС ZIP — четирите пространствени сегмента за кадастралния префикс':'ГИС покритието не е потвърдено'),source:'Одобрена работна ГИС база V26'};\n });\n return {results,summary:{found_count:results.filter(r=>r.status==='Намерен').length,requested_count:results.length,geometry_area_sum_m2:results.reduce((s,r)=>s+r.area_m2_source,0),archived_zones:[],note:'Работна ГИС база V26: '+archiveName},geometry_qa:[]};\n}\nreturn {openHosted,lookup};\n});\n");
