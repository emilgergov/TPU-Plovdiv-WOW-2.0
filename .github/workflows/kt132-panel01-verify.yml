          leadSource=patchOnce(leadSource," async function afterProcess(){"," async function chooseLeadingDocument(){\n  const w=root.KT80WorkflowState,caseId=record?.case_id,intake=w?.intake;\n  const names=[...new Set([...(intake?.files||[]).map(f=>f.name||f.filename||f.file),...(intake?.document_texts||[]).map(d=>d.source)].filter(n=>typeof n==='string'&&n.length))];\n  if(!caseId||!names.length||w.leadingDocument?.caseId===caseId)return;\n  const dialog=document.createElement('dialog');dialog.className='kt126-dialog';\n  const heading=document.createElement('h2');heading.textContent='Водещ документ по преписката';\n  const label=document.createElement('label');label.textContent='Кой документ поставя текущото искане?';\n  const select=document.createElement('select');\n  select.add(new Option('Изберете документ или потвърдете, че остава за уточняване',''));\n  names.forEach(name=>select.add(new Option(name,name)));\n  label.append(select);\n  const note=document.createElement('p');note.setAttribute('role','status');\n  const accept=document.createElement('button');accept.type='button';accept.textContent='Потвърди и продължи';\n  dialog.append(heading,label,note,accept);document.body.append(dialog);\n  const finished=new Promise(resolve=>{\n   accept.onclick=()=>{const file=select.value;dialog.close();dialog.remove();resolve(file)};\n   dialog.addEventListener('cancel',event=>event.preventDefault());\n  });\n  dialog.showModal();\n  note.textContent='ЕГ сравнява документите. Можете да потвърдите и собствен избор.';\n  if(root.KT80EGSession?.request){\n   void (async()=>{\n    try{\n     const response=await root.KT80EGSession.request('https://tpu-plovdiv-ai-author-v27.emilgergov.workers.dev/author',JSON.stringify({task:'leading-document',documents:names}));\n     const proposal=await response.json();\n     if(!dialog.open||!isCurrent(caseId))return;\n     if(!response.ok||typeof proposal.reason!=='string')throw Error('Няма предложение');\n     if(!select.value&&Nu