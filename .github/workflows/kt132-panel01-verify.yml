          authorSource=patchOnce(authorSource,"  if(orientation?.task===\"gis-orientation\"){","  if(orientation?.task===\"draft-for-expert-panel\"){\n   if(!env.KT126_CASE_CONTEXT?.verified)return reply({error:\"Изисква се регистрирана преписка.\"},403);\n   const panel=KT109_ROUTE_BY_ID.get(Number(orientation.panelId));\n   const subject=text(orientation.subject,8000),scope=text(orientation.scope,12000);\n   if(!panel||!subject||!scope)return reply({error:\"Необходими са панел, предмет и обхват.\"},400);\n   const facts={panelId:Number(orientation.panelId),panelTitle:panel.title,subject,scope};\n   const requestDraft=async(instructions,body,properties)=>{\n    const response=await providerFetch(\"https://api.openai.com/v1/responses\",{method:\"POST\",signal:request.signal,\n     headers:{\"Authorization\":\"Bearer \"+env.OPENAI_API_KEY,\"Content-Type\":\"application/json\"},\n     body:JSON.stringify({model:\"gpt-4.1-mini\",store:false,max_output_tokens:3000,text:{format:{type:\"json_schema\",name:\"expert_panel_draft\",strict:true,schema:{type:\"object\",properties,required:Object.keys(properties),additionalProperties:false}}},input:[\n      {role:\"system\",content:instructions},{role:\"user\",content:JSON.stringify(body)}\n     ]})});\n    const data=await response.json();\n    return JSON.parse((data.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type===\"output_text\").map(x=>x.text).join(\"\"));\n   };\n   if(facts.panelId===17){\n    // Preserve every source sentence. The model can only classify numbered passages.\n    const passages=scope.split(/(?<=[.!?])\\s+(?=[А-ЯA-Z])/u).map(value=>value.trim()).filter(Boolean);\n    const archiveNotice=value=>/архив/iu.test(value)&&/липсва|не е открит|не е намерен/iu.test(value);\n    const defaults=passages.map(value=>archiveNotice(value)?\"archive\":/^(съпостав|да се съпостав|провер|да се провер)/iu.test(value)?\"verification\":\"request\");\n    const fields={sections:{type:\"array\",items:{type:\"string\",enum:[\"request\",\"archive\",\"verification\"]}}};\n    const evidencePrompt=\"Класифицирай номерираните пасажи в същия ред: request за съдържание на искането, archive за липсващ в тестовия архив материал, verification за предстояща проверка. Върни една категория за всеки пасаж. Използвай само предоставените пасажи.\";\n    const input={subject,passages:passages.map((value,index)=>({number:index+1,value}))};\n    const validate=response=>{\n     const sections=response?.sections;\n     if(!Array.isArray(sections)||sections.length!==passages.length)return null;\n     if(!sections.includes(\"request\"))return null;\n     return sections.every((section,index)=>[\"request\",\"archive\",\"verification\"].includes(section)&&\n      (section===\"archive\")===archiveNotice(passages[index]))?sections:null;\n    };\n    let chosen=defaults;\n    try{chosen=validate(await requestDraft(evidencePrompt,input,fields))||defaults;}catch{}\n    const findings=[];\n    try{\n     const reviewed=validate(await requestDraft(evidencePrompt+\" Провери подадената класификация и при нужда я поправи.\",{...input,authorSections:chosen},fields));\n     if(reviewed){\n      reviewed.forEach((section,index)=>{\n       if(section!==chosen[index])findings.push(\"Рецензентът коригира категорията на пасаж \"+(index+1)+\" от потвърдения обхват.\");\n      });\n      chosen=reviewed;\n     }else findings.push(\"Класификацията от рецензента не премина проверката. Проектът е наличен за експертна редакция.\");\n    }catch{\n     findings.push(\"Независимият преглед не е завършен.\");\n    }\n    const body=[\"Предмет на постъпилото искане: \"+subject];\n    for(const [section,label] of [[\"request\",\"Съдържание на искането\"],[\"archive\",\"Констатация за прегледаните материали\"],[\"verification\",\"За проверка по преписката\"]]){\n     const excerpts=passages.filter((_,index)=>chosen[index]===section);\n     if(excerpts.length)body.push(label+\"\\n\"+excerpts.join(\" \").replace(/^азглеждане(?=\\s|$)/iu,\"Разглеждане\"));\n    }\n    body.push(\"Преди произнасяне следва да се проверят наличието и съдържанието на цитираните материали в пълната преписка и да се изяснят основанията за всяка част от искането.\");\n    const draft=\"ИЗБРАН ПАНЕЛ: 17 — \"+panel.title+\"\\n\\n\"+body.join(\"\\n\\n\");\n    return reply({caseId:orientation.caseId,requestId:orientation.requestId,panelId:facts.panelId,draft,findings});\n   }\n   try{\n    const panelInstruction=\" Подготви текст за вида документ на избрания панел и остави открити въпросите, за които няма достатъчно данни.\";\n    const basis=\"Панелът е избран от експерта. Единственият източник на факти е подаденият потвърден предмет и обхват. Разграничи съдържанието на искането, удостоверените обстоятелства и въпросите за проверка. Не извеждай самостоятелни изводи за приложима процедура, срок, статут на имот, местоположение или въздействие. Ако в обхвата е отбелязан липсващ документ, посочи го като липсващ в прегледаните материали.\"+panelInstruction;\n    const authored=await requestDraft(basis+\" Върни JSON с draft, готов за експертна редакция. Напиши самия проект на документа за избрания панел на български. Адресирай конкретното искане и посочи какво остава за изясняване. Не добавяй заглавие с номер на панел.\",facts,{draft:{type:\"string\"}});\n    const authorDraft=text(authored.draft,12000);\n    if(authorDraft.length<120)throw Error(\"Incomplete draft\");\n    let reviewed=null;\n    try{reviewed=await requestDraft(basis+\" Съпостави всяко съществено твърдение с предмета и обхвата. Провери първо дали текстът е отговор по избрания панел и дали искане, срок, пространствен резултат или нормативен извод са представени като установени без опора. Авторският текст е обект на проверка. При всяко такова несъответствие посочи конкретния пасаж във findings и върни пълния поправен проект в revisedDraft. Остави revisedDraft празен само ако няма нужда от редакция.\", {...facts,authorDraft},{findings:{type:\"array\",items:{type:\"string\"}},revisedDraft:{type:\"string\"}});}catch{}\n    const correction=text(reviewed?.revisedDraft,12000);\n    const findings=Array.isArray(reviewed?.findings)?reviewed.findings.filter(x=>typeof x===\"string\").slice(0,10).map(x=>text(x,1000)):[];\n    if(!reviewed)findings.push(\"Независимият преглед не е завършен. Авторският проект е наличен за експертна редакция.\");\n    const selected=correction.length>=120?correction:authorDraft;\n    const draft=\"ИЗБРАН ПАНЕЛ: \"+String(facts.panelId).padStart(2,\"0\")+\" — \"+panel.title+\"\\n\\n\"+selected;\n    return reply({caseId:orientation.caseId,requestId:orientation.requestId,panelId:facts.panelId,draft,findings});\n   }catch(error){\n    const failure=replyProviderFailure(error,reply);\n    const detail=failure?await failure.json().catch(()=>null):null;\n    const draft=\"ИЗБРАН ПАНЕЛ: \"+String(facts.panelId).padStart(2,\"0\")+\" — \"+panel.title+\"\\n\\nПотвърден предмет: \"+subject+\"\\n\\nПотвърден обхват: \"+scope+\"\\n\\nЗа изясняване: Съпоставете потвърдения обхват с документите по преписката и уточнете кои факти и основания са удостоверени преди произнасяне.\";\n    return reply({caseId:orientation.caseId,requestId:orientation.requestId,panelId:facts.panelId,draft,fallback:true,findings:[detail?.message||\"ЕГ не върна годен проект. Показана е работна основа от потвърдените предмет и обхват за експертна редакция.\"]});\n   }\n  }\n  if(orientation?.task===\"gis-orientation\"){");
