name: KT125 Access Policy — isolated validation (R6 baseline)
on:
  workflow_dispatch:
  push:
    branches:
      - 'work/kt125-access-register-from-kt124-r6'
    paths:
      - 'cloudflare/kt125-access/**'
      - 'vt03/kt80/KT83_VT02_P1_P6_VISUAL_TEST.html'
      - 'vt03/kt80/kt125/**'
      - '.github/workflows/kt125-access-policy.yml'
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: KT125 policy syntax and security tests
        run: |
          node --check cloudflare/kt125-access/src/authorization-policy.mjs
          node cloudflare/kt125-access/test/authorization-policy.test.mjs
          node --check cloudflare/kt125-access/src/server-guard.mjs
          node cloudflare/kt125-access/test/server-guard.test.mjs
          node --check cloudflare/kt125-access/src/cloudflare-access-verifier.mjs
          node cloudflare/kt125-access/test/cloudflare-access-verifier.test.mjs
          node --check cloudflare/kt125-access/src/private-worker.mjs
          node cloudflare/kt125-access/test/private-worker.test.mjs
          node --check cloudflare/kt125-access/src/grant-commands.mjs
          node cloudflare/kt125-access/test/grant-commands.test.mjs
          node cloudflare/kt125-access/test/private-mutations.test.mjs
          node --check cloudflare/kt125-access/src/management-read.mjs
          node cloudflare/kt125-access/test/management-read.test.mjs
          node --check cloudflare/kt125-access/src/private-admin-page.mjs
          node cloudflare/kt125-access/test/private-admin-page.test.mjs
          node --check cloudflare/kt125-access/src/grant-admin-page.mjs
          node cloudflare/kt125-access/test/grant-admin-page.test.mjs
          node --check cloudflare/kt125-access/src/user-lifecycle.mjs
          node cloudflare/kt125-access/test/user-lifecycle.test.mjs
          node cloudflare/kt125-access/test/private-admin-mutations.test.mjs
          node --check cloudflare/kt125-access/src/staff-enrollment.mjs
          node cloudflare/kt125-access/test/staff-enrollment.test.mjs
          node cloudflare/kt125-access/test/private-staff-enrollment-route.test.mjs
          node --check cloudflare/kt125-access/src/staff-activation.mjs
          node cloudflare/kt125-access/test/staff-activation.test.mjs
          node cloudflare/kt125-access/test/private-staff-activation-route.test.mjs
          node cloudflare/kt125-access/test/staff-invitations-sql.test.mjs
          node cloudflare/kt125-access/test/access-requests-sql.test.mjs
          node --check cloudflare/kt125-access/src/member-auth/worker.mjs
          node cloudflare/kt125-access/test/member-auth-sql.test.mjs
          python3 cloudflare/kt125-access/test/staff_activation_sql.test.py
          python3 cloudflare/kt125-access/test/user_lifecycle_sql.test.py
          node --check cloudflare/kt125-access/src/security-audit.mjs
          node cloudflare/kt125-access/test/security-audit.test.mjs
          python3 cloudflare/kt125-access/test/atomic_sql.test.py
          python3 cloudflare/kt125-access/test/security_audit_sql.test.py
          git fetch origin 1e949e654f9d002f51f7e0b0e8629a78f43512d1 --depth=1
          node cloudflare/kt125-access/test/dashboard-launcher.test.mjs
      - name: Verify KT124-R6 untouched in KT125 development
        run: |
          git fetch origin 1e949e654f9d002f51f7e0b0e8629a78f43512d1 --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "1e949e654f9d002f51f7e0b0e8629a78f43512d1"
          git diff --quiet FETCH_HEAD --             cloudflare/ai-author-v27/src             vt03/kt80/integration/kt96-eg-ai-stage4-author.mjs             vt03/kt80/integration/kt116-expert-approval-handoff.mjs             vt03/kt80/integration/kt117-stage5-document-author.mjs             vt03/kt80/integration/kt119-docx-generator.mjs
          echo "PASS: R6 author, review, Stage5, Word and visual shell not modified"

