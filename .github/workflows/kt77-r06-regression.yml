name: KT77 R06 PI MASTER expert panel regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kt77-r06-regression.yml'
      - 'v26-test/v27-preview/V27_27_KT77_03_PI_MASTER_FULL_R06.html'
      - 'v26-test/v27-preview/kt77-r06-readonly-regression.cjs'
      - 'v26-test/v27-preview/kt77-pi-master-readonly-index.js'
      - 'v26-test/gis-data/pi-master/browser-index/**'
permissions:
  contents: read
jobs:
  verify-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full 67-part integrity verification
        run: node v26-test/gis-data/pi-master/verify-browser-index.cjs v26-test/gis-data/pi-master/browser-index
      - name: GIS/map and generator non-regression + real test parcels
        run: node v26-test/v27-preview/kt77-r06-readonly-regression.cjs
      - name: JavaScript syntax check
        run: |
          node --check v26-test/v27-preview/kt77-pi-master-readonly-index.js
          node --check v26-test/v27-preview/kt77-r06-readonly-regression.cjs
