name: KT134 KT126 registry GET route diagnostics
on:
  push:
    branches:
      - kt134-auto-mode-isolated
    paths:
      - .github/workflows/kt134-probe-kt126-registry.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual KT126 registration route contract without live writes
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/tpu-plovdiv-kt125-local-auth',{headers:{authorization:'Bearer '+process.env.CF_TOKEN}});
          if(!r.ok)throw Error('WORKER_SOURCE_UNAVAILABLE_'+r.status);
          const s=await r.text();
          for(const term of ['/kt126/registry/create','async function createCase(','function createCase(','await createCase(','const created = await registry','registryApi("/create"','registryApi("/create",','/create", {','/kt126/registry']){
            const hits=[];let start=0;
            for(let i=0;i<20;i++){const p=s.indexOf(term,start);if(p<0)break;hits.push(p);start=p+term.length}
            console.log('TERM '+term+' COUNT '+hits.length);
            for(const p of hits.slice(0,7)){
              let part=s.slice(Math.max(0,p-850),p+1350);
              part=part.replace(/(authorization|password|secret|token|api[_-]?key)\s*[:=]\s*['"`][^'"`]+['"`]/gi,'$1=[REDACTED]');
              part=part.replace(/['"`][A-Za-z0-9+/=_-]{90,}['"`]/g,'[LONG_STRING_REDACTED]');
              console.log('ROUTE_CONTEXT_START\n'+part+'\nROUTE_CONTEXT_END');
            }
          }
          NODE
