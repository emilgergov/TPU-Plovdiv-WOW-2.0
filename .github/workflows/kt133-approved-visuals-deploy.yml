name: KT133 — Publish approved visual modifications (rollback protected)
# KT134 VISUAL 2026-11-27: prepaint stage navigation, original step handler and non-overlapping notices; dry run passed, backend unchanged.
# KT134 approved cinematic release for the five protected stage entry screens.
# Fix return links from the five KT134 stage entries.
# Style the guarded Stage 5 information view on direct KT134 entry.
# Apply approved cinematic styling to both existing Stage 5 views.
# Match Stage 5 backdrop styles to the actual class emitted by the live module.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kt133-approved-visuals-deploy.yml'
  workflow_dispatch:
# KT133: restore approved short titles without ИП and readable larger typography; entry isolation unchanged.
permissions:
  contents: read
concurrency:
  group: kt133-approved-visual-production
  cancel-in-progress: false
jobs:
  publish:
    name: Add approved visuals to existing KT133 gateway
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved files and rollback-capable installer
        run: |
          node --check kt80/KT133_APPROVED_VISUALS.js
          node --check tests/kt133-proxy-visuals-patch.cjs
          node --check tests/kt133-approved-visuals-deploy.cjs
          node tests/kt134-kt133-integration-gate.cjs
      - name: Deploy visual-only update to existing KT133 gateway and verify
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
        run: node tests/kt133-approved-visuals-deploy.cjs
      - name: Confirm no protected case data accessed by CI
        run: echo "No D1 queries, case mutations, registration changes or backend Worker deploys."
