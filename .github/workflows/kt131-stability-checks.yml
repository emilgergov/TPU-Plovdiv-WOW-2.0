name: KT131 isolated reliability and editor checks
on:
  push:
    branches: [work/kt131-stability-editor]
    paths: ['cloudflare/**', '.github/workflows/kt131-stability-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare/kt125-access
      - name: Verify provider classification and exact original business baseline
        run: |
          node cloudflare/kt125-access/test/kt131-provider-transport.test.mjs
          node cloudflare/kt125-access/test/author-origin.test.mjs
      - name: Verify bounded requests, private registry and editor regressions
        working-directory: cloudflare/kt125-access
        run: |
          node test/kt131-feedback-overlays.test.mjs
          node test/kt131-author-deadline.test.mjs
          node test/kt126-registry.test.mjs
          node test/kt128-session-bridge.test.mjs
          node test/kt126-gateway.test.mjs
          node test/presentation-polish.test.mjs
          node test/kt130-intelligent-editor.test.mjs
          node test/kt131-editor-diff.test.mjs
          node test/kt130-reset-restore-race.test.mjs
