name: Restore paired KT133 preview versions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eg-author-access-restore.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the paired version references and restore the author override
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const native='tpu-plovdiv-kt125-local-auth',author='tpu-plovdiv-ai-author-v27';
          const base='https://api.cloudflare.com/client/v4/accounts/90df5489417e4b53179a852c446aeed1/workers/scripts/';
          async function api(path,init={}){
            const r=await fetch(base+path,{...init,headers:{Authorization:'Bearer '+process.env.CF_TOKEN,...init.headers},signal:AbortSignal.timeout(20000)});
            const d=await r.json();assert.ok(r.ok&&d.success,'Cloudflare HTTP '+r.status+' on '+path);return d.result;
          }
          const [router,authorHistory,nativeHistory]=await Promise.all([
            api('kt133-'+native+'/settings'),api(author+'/deployments'),api(native+'/deployments')
          ]);
          const read=(bindings,name)=>bindings.find(b=>b.name===name&&b.type==='plain_text')?.text;
          const uuid=/^[0-9a-f-]{36}$/i;
          const nativeId=read(router.bindings,'KT131_NATIVE_VERSION');
          assert.match(nativeId||'',uuid);
          assert.ok(router.bindings.some(b=>b.name==='KT131_NATIVE'&&b.service===native));
          const paired=await api(native+'/versions/'+nativeId);
          const authorId=read(paired.resources.bindings,'KT131_AUTHOR_VERSION');
          assert.match(authorId||'',uuid);
          assert.ok(paired.resources.bindings.some(b=>b.name==='KT133_EVIDENCE_KEY'),'Native preview has no evidence signature binding');
          const av=await api(author+'/versions/'+authorId);
          assert.ok(av.resources.bindings.some(b=>b.name==='KT133_EVIDENCE_KEY'),'Paired author has no evidence signature binding');
          const authorAlloc=authorHistory.deployments[0].versions;
          const nativeAlloc=nativeHistory.deployments[0].versions;
          assert.ok(nativeAlloc.some(v=>v.version_id===nativeId),'Router native override is not active');
          assert.equal(authorAlloc.filter(v=>v.percentage===100).length,1);
          if(!authorAlloc.some(v=>v.version_id===authorId)){
            const versions=[...authorAlloc.map(({version_id,percentage})=>({version_id,percentage})),{version_id:authorId,percentage:0}];
            await api(author+'/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'percentage',versions})});
          }
          const after=(await api(author+'/deployments')).deployments[0].versions;
          assert.ok(after.some(v=>v.version_id===authorId),'Paired author override missing');
          assert.equal(after.find(v=>v.percentage===100).version_id,authorAlloc.find(v=>v.percentage===100).version_id);
          console.log('KT133 paired signed-evidence author override is available; primary author traffic unchanged.');
          JS
