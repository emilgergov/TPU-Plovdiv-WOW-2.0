name: Check live EG Author access configuration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eg-author-access-restore.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live bridge and bindings without case data
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://api.cloudflare.com/client/v4/accounts/90df5489417e4b53179a852c446aeed1/workers/scripts/';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN};
          async function get(path){
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(20000)});
            assert.ok(r.ok,'Cloudflare HTTP '+r.status+' on '+path);
            return r;
          }
          const author='tpu-plovdiv-ai-author-v27', native='tpu-plovdiv-kt125-local-auth';
          const [source,authorSettings,nativeSettings]=await Promise.all([
            get(author).then(r=>r.text()), get(author+'/settings').then(r=>r.json()),get(native+'/settings').then(r=>r.json())
          ]);
          assert.equal(authorSettings.success,true);
          assert.equal(nativeSettings.success,true);
          const has=(settings,name,type)=>settings.result.bindings.some(b=>b.name===name&&b.type===type);
          console.log(JSON.stringify({
            authorHasCaseRegistryCheck:source.includes('KT126_REGISTRY')&&source.includes('getCaseContext'),
            authorHasNativeOrigin:source.includes('https://'+native+'.emilgergov.workers.dev'),
            authorRegistryBinding:has(authorSettings,'KT126_REGISTRY','service'),
            nativeAuthorBinding:has(nativeSettings,'KT128_AUTHOR','service'),
            editorialCorrection:source.includes('editorialFlags.unshift(')&&source.includes('UNSUPPORTED_CATEGORICAL_CONCLUSION')
          }));
          JS
