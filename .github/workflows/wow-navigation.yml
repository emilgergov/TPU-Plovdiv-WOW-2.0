name: WOW 2.0 navigation audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'WOW_APP.html'
      - 'tests/**'
      - 'media/**'
      - '.github/workflows/wow-navigation.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check required WOW media
        run: node tests/check-assets.mjs
      - name: Validate direct-route startup repair candidate (CI only)
        run: python3 tests/repair-direct-route-ci.py
      - name: Inspect exact failing HTML statements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('WOW_APP.html').read_text(encoding='utf-8').splitlines()
          for n in (3272,3297,3320):
              print('ERROR LOCATION',n)
              for k in range(n-3,n+4):
                  if 0<k<=len(a):
                      print(f'{k}: {a[k-1][:320]}')
          PY
      - name: Inspect remaining optional panel startup failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('WOW_APP.html').read_text(encoding='utf-8').splitlines()
          for start,end in ((3287,3298),(3310,3321)):
              print('DETAIL BLOCK',start,end)
              for n in range(start,end+1):
                  print(f'{n}: {a[n-1][:1800]}')
          PY
      - name: Inspect remaining JS failure line 3324
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('WOW_APP.html').read_text(encoding='utf-8').splitlines()
          for n in range(3322,3328):
              print(f'{n}: {a[n-1][:2400]}')
          PY
      - name: Inspect original Tera MP4 codec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,profile,pix_fmt,width,height -of json media/TERA_TPU_PLOVDIV_PANORAMA_3MIN_12_10_2026.mp4
          node -e "const fs=require('fs'); const f='media/TERA_TPU_PLOVDIV_PANORAMA_3MIN_12_10_2026.mp4'; console.log('MP4 bytes:',fs.statSync(f).size)"
      - name: Test routes in Chromium
        run: node tests/wow-navigation.mjs
      - name: Save evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-navigation-evidence
          path: wow-test-results/
          if-no-files-found: warn
