name: V26 document smoke
on:
  push:
    branches: [main, 'work/v26-auto-word-evidence-20261028']
    paths:
      - 'expert-v26/v26-draft-package.js'
      - 'expert-v26/index.html'
      - 'expert-v26/v26-unified-context.js'
      - 'expert-v26/v26-word-review.js'
      - 'expert-v26/v26-template-word.js'
      - 'expert-v26/templates/**'
      - 'expert-v26/v26-annex2-browser.js'
      - 'expert-v26/tests/document-smoke.cjs'
      - 'expert-v26/tests/document-real-pdf.cjs'
      - '.github/workflows/v26-document-smoke.yml'
  workflow_dispatch:
jobs:
  document-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jszip@3.10.1 pdfmake@0.2.20 pdf-parse@1.1.1
      - run: node --check expert-v26/v26-draft-package.js
      - run: node --check expert-v26/v26-template-word.js
      - run: node --check expert-v26/v26-word-review.js
      - run: node --check expert-v26/tests/document-smoke.cjs
      - run: node expert-v26/tests/document-smoke.cjs
      - run: node --check expert-v26/tests/document-real-pdf.cjs
      - run: node expert-v26/tests/document-real-pdf.cjs
