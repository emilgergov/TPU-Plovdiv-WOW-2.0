name: KT83 - Independent normative engine V11
on:
  push:
    paths:
      - 'kt80/integration/**'
      - 'kt80/independence/**'
      - '.github/workflows/kt83-independent-normative-engine.yml'
  workflow_dispatch:
jobs:
  test-stage4-stage5:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent V11 legal evidence and fee smoke tests
        run: node --test kt80/integration/stage4-stage5-smoke.test.mjs
      - name: Isolated KT83 V1.3 preview regression and syntax
        run: |
          node --check kt80/integration/kt83-v1-3-admin-preview.mjs
          node --check kt80/integration/kt80-v598-case-evidence-adapter.mjs
          node --check kt80/integration/stage4-independent-legal-engine.mjs
          node --check kt80/integration/stage5-independent-proposal.mjs
          node --test kt80/integration/kt83-preview-regression.test.mjs
      - name: KT83 V1.4 auto discovery from confirmed subject and evidence
        run: |
          node --check kt80/integration/kt83-v1-4-hypothesis-discovery.mjs
          node --check kt80/integration/kt83-v1-4-admin-auto-preview.mjs
          node --test kt80/integration/kt83-v1-4-auto-discovery.test.mjs
      - name: PNI KT83 mandatory normative isolation gate
        run: |
          node --check kt80/independence/pni-gate.mjs
          node kt80/independence/pni-gate.mjs
          node --test kt80/independence/pni-gate.test.mjs
