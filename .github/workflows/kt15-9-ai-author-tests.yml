name: KT15.9 AI author contract tests
on:
  push:
    paths:
      - 'v26-test/kt15-6/v26-ai-author-*.js'
      - 'v26-test/kt15-6/tests/kt15-9-*.test.cjs'
      - 'v26-test/kt15-6/tests/kt19-heading.test.cjs'
      - 'v26-test/v26-local-intake.js'
      - 'v26-test/kt15-6/v26-ai-author-gateway.cjs'
      - 'v26-test/kt15-6/v26-ai-provider.cjs'
      - 'v26-test/kt15-6/v26-ai-server.cjs'
      - 'v26-test/kt15-6/v26-word-author-approval.cjs'
      - 'v26-test/kt15-6/v26-final-package.cjs'
      - 'v26-test/kt15-6/v26-kt20-orchestrator.cjs'
      - 'v26-test/kt15-6/tests/kt20-orchestrator.test.cjs'
      - 'v26-test/kt15-6/tests/kt20-7-real-container-integration.test.cjs'
      - 'v26-test/kt15-6/tests/kt20-8-real-browser-wiring.test.cjs'
      - 'v26-test/kt15-6/tests/kt20-9-chromium-runtime.test.cjs'
      - 'v26-test/kt15-6/tests/kt21-1-real-classic-docx.test.cjs'
      - 'v26-test/kt15-6/tests/kt21-2-real-expert-docx.test.cjs'
      - 'v26-test/kt15-6/tests/kt20-1-browser-word-bridge.test.cjs'
      - 'v26-test/kt15-6/tests/kt20-3-ai-review-ui.test.cjs'
      - 'v26-test/kt15-6/v26-author-bridge.js'
      - 'v26-test/kt15-6/tests/kt20-4-author-bridge.test.cjs'
      - 'v26-test/kt15-6/v26-invisible-author-pipeline.cjs'
      - 'v26-test/kt15-6/tests/kt20-5-invisible-author-pipeline.test.cjs'
      - 'v26-test/kt15-6/index.html'
      - 'v26-test/kt15-6/v26-draft-package.js'
      - 'v26-test/kt15-6/v26-expert-word.js'
      - 'v26-test/kt15-6/tests/kt19-9-final-package.test.cjs'
      - 'v26-test/kt15-6/tests/kt19-7-word-approval.test.cjs'
      - 'v26-test/kt15-6/tests/kt19-6-provider.test.cjs'
      - 'v26-test/kt15-6/tests/kt19-5-gateway.test.cjs'
      - '.github/workflows/kt15-9-ai-author-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate expert author input, output and prompt
        run: |
          node v26-test/kt15-6/tests/kt15-9-ai-author-contract.test.cjs
          node v26-test/kt15-6/tests/kt15-9-ai-author-prompt.test.cjs
          node v26-test/kt15-6/tests/kt19-heading.test.cjs
          node v26-test/kt15-6/tests/kt19-5-gateway.test.cjs
          node v26-test/kt15-6/tests/kt19-6-provider.test.cjs
          node v26-test/kt15-6/tests/kt19-7-word-approval.test.cjs
          node v26-test/kt15-6/tests/kt19-9-final-package.test.cjs
          node v26-test/kt15-6/tests/kt20-orchestrator.test.cjs
          node v26-test/kt15-6/tests/kt20-7-real-container-integration.test.cjs
          node v26-test/kt15-6/tests/kt20-8-real-browser-wiring.test.cjs
          node v26-test/kt15-6/tests/kt20-1-browser-word-bridge.test.cjs
          node v26-test/kt15-6/tests/kt20-3-ai-review-ui.test.cjs
          node v26-test/kt15-6/tests/kt20-4-author-bridge.test.cjs
          node v26-test/kt15-6/tests/kt20-5-invisible-author-pipeline.test.cjs

  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test runner
        run: |
          cd v26-test/kt15-6
          npm install --no-save --no-package-lock playwright@1.56.1 fflate@0.8.2
          npx playwright install --with-deps chromium
      - name: Execute real browser runtime smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v26-kt20-9-http.log 2>&1 &
          sleep 2
          node v26-test/kt15-6/tests/kt20-9-chromium-runtime.test.cjs
          node v26-test/kt15-6/tests/kt21-1-real-classic-docx.test.cjs
          node v26-test/kt15-6/tests/kt21-2-real-expert-docx.test.cjs
