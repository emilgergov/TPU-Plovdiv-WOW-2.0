name: KT126 reader status diagnostic
on:
  push:
    branches: [work/kt125-access-register-from-kt124-r6]
    paths: ['.github/workflows/kt126-reader-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect only stored reader status for the current acceptance case
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {gunzipSync} from 'node:zlib';
          const base='https://api.cloudflare.com/client/v4/accounts/90df5489417e4b53179a852c446aeed1',headers={Authorization:'Bearer '+process.env.CF_TOKEN};
          const settings=await fetch(base+'/workers/scripts/tpu-plovdiv-kt125-local-auth/settings',{headers}).then(r=>r.json());if(!settings.success)throw Error('Settings unavailable');
          const id=settings.result.bindings.find(b=>b.name==='KT125_DB'&&b.type==='d1')?.id;if(!id)throw Error('Registry unavailable');
          const sql="SELECT v.content_json FROM kt126_versions v JOIN kt126_registry r USING(case_id) WHERE r.organization_id=? AND r.internal_number=? AND v.kind='state' ORDER BY v.revision DESC LIMIT 1";
          const result=await fetch(base+'/d1/database/'+id+'/query',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({sql,params:['riosv-plovdiv','EG-2026-000003']})}).then(r=>r.json());if(!result.success)throw Error('Status query failed');
          const row=result.result[0]?.results?.[0];if(!row){console.log('READER_DIAGNOSTIC: no saved working snapshot yet');process.exit(0)}
          let state=JSON.parse(row.content_json);if(state.format==='KT126-GZIP-1')state=JSON.parse(gunzipSync(Buffer.from(state.payload,'base64')).toString('utf8'));
          const intake=state.state?.intake;console.log('READER_DIAGNOSTIC',JSON.stringify({files:(intake?.files||[]).map((f,index)=>({index,status:f.status||f.read_status||f.readingStatus||null})),pages:Array.isArray(intake?.page_text_index)?intake.page_text_index.length:0,documentTextLengths:(intake?.document_texts||[]).map(d=>String(d.text||'').length)}));
          NODE
