name: KT134 isolated protected integration preflight
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths:
      - 'kt134-auto/KT134_PROTECTED_INTEGRATION_UI.html'
      - 'kt134-auto/kt134-protected-http-integration.mjs'
      - 'kt134-auto/kt134-protected-http-integration.test.mjs'
      - '.github/workflows/kt134-protected-integration-preflight.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCOUNT_ID: "90df5489417e4b53179a852c446aeed1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kt134-auto-mode-isolated
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real UI client and protected server syntax
        run: |
          set -euo pipefail
          node --check kt134-auto/kt134-protected-http-integration.mjs
          node --test kt134-auto/kt134-protected-http-integration.test.mjs
          node --test kt134-auto/kt134-eg-stage45-live-bridge.test.mjs
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('kt134-auto/KT134_PROTECTED_INTEGRATION_UI.html','utf8');
          const script=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          assert.ok(script&&script.includes("fetch('/kt134/automatic/draft'"));
          assert.ok(!script.includes('setTimeout(advance'));
          assert.ok(!html.includes('Демонстрационен потребител'));
          writeFileSync('/tmp/kt134-ui-check.mjs',script);
          NODE
          node --check /tmp/kt134-ui-check.mjs
      - name: Read-only identify configured KT125 and KT134 Cloudflare Workers
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts" \
            > /tmp/kt134-workers.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const raw=JSON.parse(readFileSync('/tmp/kt134-workers.json','utf8'));
          if(!raw.success||!Array.isArray(raw.result))throw Error('CLOUDFLARE_WORKER_DISCOVERY_FAILED');
          const list=raw.result.filter(w=>/kt12[345]|kt13[34]|tpu-plovdiv-kt134|local-auth/i.test(w.id||w.name||''))
            .map(w=>({name:w.id||w.name,modified:w.modified_on||null}));
          writeFileSync('kt134-auto/KT134_CLOUDFLARE_WORKER_DISCOVERY.json',JSON.stringify({
            source:'Cloudflare read-only API',testedAt:new Date().toISOString(),
            testTarget:'tpu-plovdiv-kt134-test',egTarget:'tpu-plovdiv-kt134-eg-test',
            workers:list,
            warning:'Worker names are not proof of KT125 protected host connectivity'
          },null,2)+'\n');
          console.log('KT134 relevant Workers: '+list.map(x=>x.name).join(', '));
          NODE
      - name: Store sanitized discovery for protected host integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kt134-auto/KT134_CLOUDFLARE_WORKER_DISCOVERY.json
          if ! git diff --cached --quiet; then
            git commit -m 'KT134: record read-only isolated Worker discovery for integration'
            git push origin HEAD:kt134-auto-mode-isolated
          fi
