name: KT134 inspect KT125 D1 structure (metadata only)
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-d1-structure-inspect.yml']
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: "90df5489417e4b53179a852c446aeed1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read-only KT125 D1 table names and column types
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          const r=await fetch(root+'/workers/scripts/tpu-plovdiv-kt125-local-auth/settings',{headers});
          const s=await r.json();
          if(!s.success)throw Error('KT125_SETTINGS_UNAVAILABLE');
          const binding=(s.result?.bindings||[]).find(x=>x.name==='KT125_DB'&&x.type==='d1');
          const db=binding?.id||binding?.database_id;
          if(!db)throw Error('KT125_D1_ID_UNAVAILABLE');
          const query=async(sql)=>{
            const response=await fetch(root+'/d1/database/'+db+'/query',{method:'POST',headers,body:JSON.stringify({sql})});
            const json=await response.json();
            if(!json.success)throw Error('KT125_D1_METADATA_QUERY_REJECTED_'+response.status);
            return json.result?.[0]?.results||[];
          };
          const tables=await query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
          const whitelist=tables.map(x=>String(x.name)).filter(x=>/case|dossier|user|session|document|file|registry|evidence|archive|attachment/i.test(x)).slice(0,25);
          const output=[];
          for(const name of whitelist){
            if(!/^[\w-]+$/.test(name))continue;
            const columns=await query('PRAGMA table_info("'+name+'")');
            output.push({table:name,columns:columns.map(x=>({name:x.name,type:x.type,pk:x.pk}))});
          }
          writeFileSync('kt134-auto/KT134_KT125_D1_SCHEMA.json',JSON.stringify({readOnly:true,tables:output},null,2)+'\n');
          console.log('KT125 metadata inspected: '+output.map(x=>x.table).join(', '));
          NODE
      - name: Save schema metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kt134-auto/KT134_KT125_D1_SCHEMA.json
          git commit -m 'KT134: inspect KT125 D1 table structure without reading records' || exit 0
          git push origin HEAD:kt134-auto-mode-isolated
