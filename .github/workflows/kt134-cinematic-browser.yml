name: KT134 cinematic browser acceptance
on:
  push:
    branches: [kt134-five-reference-cinematic-dashboard]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kt134-auto
            tests
      - uses: actions/checkout@v4
        with:
          ref: 05463d61d30cfd9594416b326cadc2b3e8a1f220
          path: portal-reference
          sparse-checkout: |
            index.html
            scenes/wow-plovdiv-panorama.webp
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: ce73ad53e9291b28ef0aa225c68d924f28b7e28a
          path: classic-reference
          sparse-checkout: |
            vt03
            kt80
            v26-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: google-chrome --version
      - run: node kt134-auto/kt134-cinematic-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KT134-cinematic-browser
          path: visual-check/
