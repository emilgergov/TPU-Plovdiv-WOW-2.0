name: KT77-11 A and B locked DOCX OOXML audit

on:
  push:
    branches:
      - work/KT77-11-two-stage-editor
    paths:
      - 'v26-test/v27-preview/kt77-11/**'
      - '.github/workflows/kt77-11-a-b-etalon-ooXML-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect both original locked Word specimens, fail closed
        run: |
          python3 v26-test/v27-preview/kt77-11/kt77_11_ooxml_audit.py kt77-11-ab-ooxml-report.json
      - name: Verify both deterministic secondary editors fail closed
        run: |
          python3 v26-test/v27-preview/kt77-11/test_secondary_editor.py
      - name: Syntax-check browser A/B editor and isolated route, verify no bypass
        run: |
          node --check v26-test/v27-preview/kt77-11/kt77-11-4-browser-secondary-editor.js
          node --check v26-test/v27-preview/kt77-11/kt77-11-4-case-evidence-bridge.js
          node --check v26-test/v27-preview/kt77-11/kt77-11-4-evidence-span-matcher.js
          node v26-test/v27-preview/kt77-11/test_evidence_span_matcher.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("v26-test/v27-preview/V27_27_KT77_11_4_A_B_SECONDARY_EDITOR_INTEGRATION_TEST.html")
          html=p.read_text(encoding="utf-8")
          assert "KT7711SecondaryEditor.transform(kt7606.blob" in html
          assert html.index("KT7711SecondaryEditor.transform(kt7606.blob") < html.index("KT7706ZTConstatation.fix(kt7711.blob")
          assert "if(!evidencePlan?.verified||!evidencePlan?.patches?.length||!evidencePlan?.evidence?.length)" in html
          assert "КТ77-11.4 · ИЗОЛИРАН ИНТЕГРАЦИОНЕН ТЕСТ" in html
          assert "kt77-11/kt77-11-4-browser-secondary-editor.js" in html
          assert "kt77-11/kt77-11-4-case-evidence-bridge.js" in html
          assert "kt77-11/kt77-11-4-evidence-span-matcher.js" in html
          assert "абзац №" in html and "console.warn('КТ77-11.4: доказателствен контрол" in html
          print("PASS: isolated A/B ZIP interception before ZT and explicit evidence gate")
          PY
      - name: Exercise real A and B binary DOCX with browser editor (isolated Node)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts fflate@0.8.2 @xmldom/xmldom@0.9.8
          node v26-test/v27-preview/kt77-11/test_browser_secondary_editor.cjs
      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: KT77-11-original-Classic-A-B-OOXML
          path: kt77-11-ab-ooxml-report.json
          retention-days: 30
