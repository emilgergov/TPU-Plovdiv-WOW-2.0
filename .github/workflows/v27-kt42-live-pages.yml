name: V27 KT45 live Pages deployment verification
on:
  push:
    paths:
      - '.github/workflows/v27-kt42-live-pages.yml'
      - 'v26-test/v27-preview/index.html'
      - 'v26-test/v27-preview/v27-kt41-etalon-bridge.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm real Pages deployment serves KT44 and all approved DOCX files
        run: |
          python - <<'PY'
          import urllib.request,time,zipfile,io,json
          base='https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/v27-preview/'
          expected='v27-preview/v27-kt41-etalon-bridge.js?v=kt45-full-place-9e2b4bf'
          last=''
          for attempt in range(36):
              try:
                  req=urllib.request.Request(base+'?kt44='+str(attempt),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=18) as res: html=res.read().decode('utf-8')
                  if expected not in html: raise RuntimeError('Pages still serves old Word generator')
                  with urllib.request.urlopen(base+'v27-kt41-etalon-bridge.js?kt44=verification',timeout=18) as res: code=res.read().decode('utf-8')
                  if any(k not in code for k in ('function isApprovedCase','function characterizationDraft','function legalDraft','function impactDraft','function heading','function putHeading','function zoneList')): raise RuntimeError('Live JS not KT44')
                  for filename in ('KT35-A.docx','KT39-B.docx','V27-R02.docx'):
                      with urllib.request.urlopen(base+'etalon/'+filename,timeout=18) as res: raw=res.read()
                      with zipfile.ZipFile(io.BytesIO(raw)) as z:
                          assert 'word/document.xml' in z.namelist(),filename
                  print('LIVE PAGES KT45 PASS: HTML, JS and all three approved DOCX files')
                  break
              except Exception as e:
                  last=str(e)
                  if attempt==35: raise RuntimeError('KT45 Pages deployment not verified: '+last)
                  time.sleep(8)
          PY
      - name: Record verified public Pages deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          marker=Path('v26-test/v27-preview/KT45_LIVE_VERIFIED.json')
          marker.write_text(json.dumps({'checkpoint':'KT45','result':'LIVE_PAGES_VERIFIED','verified_repo_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'checks':['HTML serves KT45 loader','Live Word bridge contains KT45 safeguards','KT35-A.docx accessible','KT39-B.docx accessible','V27-R02.docx accessible']},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v26-test/v27-preview/KT45_LIVE_VERIFIED.json
          git commit -m "KT45: verified public Pages serves headings with settlement municipality region"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 3
          done
