name: KT134 inspect Cloudflare module boundaries read-only
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-inspect-worker-modules.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCOUNT_ID: "90df5489417e4b53179a852c446aeed1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read-only inspect existing KT133 and KT134 script modules
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const names=['kt133-tpu-plovdiv-kt125-local-auth','tpu-plovdiv-kt134-test'];
          const output=[];
          for(const name of names){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+'/workers/scripts/'+name,
              {headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
            if(!r.ok)throw Error('SCRIPT_UNAVAILABLE_'+name+'_'+r.status);
            const contentType=r.headers.get('content-type')||'';
            const boundary=contentType.match(/boundary="?([^";]+)/i)?.[1];
            const text=await r.text();
            const parts=boundary?text.split('--'+boundary).filter(x=>x.includes('Content-Disposition')):[text];
            const modules=parts.map(p=>{
              const head=p.slice(0,p.indexOf('\r\n\r\n')+4);
              const body=p.slice(head.length).replace(/\r\n$/,'');
              const file=head.match(/filename="([^"]+)"/i)?.[1]||'metadata';
              const literals=[...body.matchAll(/['"`](\/[A-Za-z][\w\/-]{1,78})['"`]/g)].map(x=>x[1]);
              const endpoints=[...new Set(literals)].filter(x=>/auth|login|session|case|dossier|api|user|stage|kt|health|preview/i.test(x)).slice(0,75);
              const keywords=['fetch(','async fetch','request.url','new URL(','pathname','Authorization','cookie','session','caseId','env.','service'];
              const lines=body.split(/\r?\n/).map((line,i)=>({line:i+1,text:line.trim()})).filter(x=>keywords.some(k=>x.text.includes(k)))
                .map(x=>({line:x.line,excerpt:x.text.slice(0,250).replace(/([A-Za-z0-9_]{36,})/g,'[REDACTED]')})).slice(0,28);
              return {file,bytes:body.length,endpoints,lines};
            });
            output.push({name,modules});
          }
          writeFileSync('kt134-auto/KT134_WORKER_MODULE_ROUTES.json',JSON.stringify({readOnly:true,inspectedAt:new Date().toISOString(),workers:output},null,2)+'\n');
          console.log('inspected modules for '+names.join(', '));
          NODE
      - name: Store route-only report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kt134-auto/KT134_WORKER_MODULE_ROUTES.json
          if ! git diff --cached --quiet; then
            git commit -m 'KT134: inspect Cloudflare module route surface without modifying Workers'
            git push origin HEAD:kt134-auto-mode-isolated
          fi
