name: KT134 inspect real login form and POST origin behavior
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-login-form-post-diagnostic.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - name: Compare public login HTML form and empty POST requests
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const hosts=['https://tpu-plovdiv-kt125-local-auth.emilgergov.workers.dev','https://tpu-plovdiv-kt134-test.emilgergov.workers.dev'];
          const findings=[];
          for(const host of hosts){
            const r=await fetch(host+'/auth/login',{redirect:'manual'});
            const html=await r.text();
            const forms=[...html.matchAll(/<form\b[^>]*>/gi)].map(m=>m[0].slice(0,600));
            const scripts=[...html.matchAll(/(?:action|fetch|axios|location\.href|window\.location|ORIGIN_REJECTED)[^\n]{0,180}/gi)].map(m=>m[0]).slice(0,15);
            const posts=[];
            for(const origin of [host,null,'null']){
              const headers={'content-type':'application/x-www-form-urlencoded','referer':host+'/auth/login'};
              if(origin!==null)headers.origin=origin;
              const response=await fetch(host+'/auth/login',{method:'POST',redirect:'manual',headers,body:'username=&password='});
              const responseText=await response.text();
              posts.push({origin:origin===null?'ABSENT':origin,status:response.status,
                originRejected:responseText.includes('ORIGIN_REJECTED'),
                code:responseText.match(/"error":"([A-Z_]+)"/)?.[1]||'NONE',
                isHtml:/<!doctype|<html|<form/i.test(responseText)});
            }
            findings.push({host,getStatus:r.status,forms,scripts,posts});
          }
          writeFileSync('kt134-auto/KT134_LOGIN_FORM_POST_DIAGNOSTIC.json',JSON.stringify({publicOnly:true,findings},null,2)+'\n');
          console.log(findings.map(x=>x.host+' '+JSON.stringify(x.posts)).join('\n'));
          NODE
      - name: Save sanitized form and origin check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p='kt134-auto/KT134_LOGIN_FORM_POST_DIAGNOSTIC.json'
          content="$(base64 -w0 "$p")"
          for n in 1 2 3 4; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$p?ref=kt134-auto-mode-isolated" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$p" -f branch='kt134-auto-mode-isolated' -f message='KT134: record public login form and safe blank POST origin diagnostics' -f content="$content" -f sha="$sha" >/dev/null && exit 0
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$p" -f branch='kt134-auto-mode-isolated' -f message='KT134: record public login form and safe blank POST origin diagnostics' -f content="$content" >/dev/null && exit 0
            fi
            sleep 2
          done
          exit 1
