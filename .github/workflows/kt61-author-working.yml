name: KT61 AI author working ZIP A B regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kt61-author-working.yml'
      - 'v26-test/v27-preview/kt61-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOCX inspection dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Protect the three approved Word references
        run: node v26-test/v27-preview/kt50-original-kt42-regression.cjs
      - name: Check KT61 working author JS syntax
        run: node --check v26-test/v27-preview/kt61-draft-writer.js
      - name: Verify actual classic B and expert R02 project generation
        run: node v26-test/v27-preview/kt61-draft-writer-regression.cjs
      - name: Check browser routing and automatic ZIP QA
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('v26-test/v27-preview/kt61-ai-author-working-test.html').read_text()
          assert 'kt61-draft-writer.js?v=kt61-draft-1' in h
          assert 'window.KT61DraftWord.install()' in h
          assert 'kt61Restore()' in h
          assert 'blob=await window.V26DraftPackage.make(' in h
          assert 'await window.KT57PackageQA.verify(blob,' in h
          assert 'v27-kt50-original-kt42.js?v=kt61-original-locked-b1d2cfb' in h
          assert 'kt53-original-draft-package.js?v=kt61-original-locked-b1d2cfb' in h
          assert 'kt53c-b-review-word.js' not in h
          assert 'kt53d-b-characterization-word.js' not in h
          assert 'if(kt60.scenario' not in h
          assert h.index('window.KT61DraftWord.install()')<h.index('blob=await window.V26DraftPackage.make(')
          print('KT61 working Word package route PASS')
          PY
