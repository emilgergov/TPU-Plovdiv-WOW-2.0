name: Deploy Cloudflare AI Author V27
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ai-author-v27/**'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Cloudflare API access (no secrets printed)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; fi
          check() {
            local label="$1" url="$2" output status
            output="$(mktemp)"
            status="$(curl -sS -o "$output" -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $CF_TOKEN" -H 'Accept: application/json' "$url")"
            echo "$label HTTP status: $status"
            node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log("Cloudflare success:",d.success,"error codes:",(d.errors||[]).map(x=>x.code).join(","),"error messages:",(d.errors||[]).map(x=>x.message).join(" | "))' "$output" || echo "Non-JSON response"
            rm -f "$output"
          }
          check "Worker settings" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/tpu-plovdiv-ai-author-v27/settings"
          check "Worker script metadata" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/tpu-plovdiv-ai-author-v27"
          check "Worker routes" "https://api.cloudflare.com/client/v4/zones?per_page=1"
          check "Worker subdomain" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
      - name: Deploy isolated Cloudflare Worker
        if: ${{ false }} # Temporarily disabled until access checks identify missing permission
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/ai-author-v27
          wranglerVersion: "4.156.0"
          command: deploy
