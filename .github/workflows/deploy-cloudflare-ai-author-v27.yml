name: Deploy Cloudflare AI Author V27
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ai-author-v27/**'
      - '.github/workflows/deploy-cloudflare-ai-author-v27.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish isolated existing Worker via Cloudflare API
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          metadata="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$metadata" "$response"' EXIT
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-10-01","keep_bindings":["secret_text"]}' > "$metadata"
          status="$(curl --silent --show-error --max-time 90 -o "$response" -w '%{http_code}' \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/tpu-plovdiv-ai-author-v27" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@$metadata;type=application/json" \
            -F "worker.js=@cloudflare/ai-author-v27/src/worker.js;type=application/javascript+module")"
          echo "Cloudflare upload HTTP status: $status"
          node - "$response" <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          let result;
          try { result = JSON.parse(raw); } catch { console.error('Non-JSON Cloudflare response:', raw.slice(0, 500)); process.exit(1); }
          console.log('Cloudflare success:', result.success);
          for (const e of result.errors || []) console.error('Cloudflare error:', e.code, e.message);
          if (!result.success) process.exit(1);
          NODE
          [[ "$status" == "200" || "$status" == "201" ]] || exit 1
      - name: Activate newest uploaded Worker version
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
        run: |
          set -euo pipefail
          versions="$(mktemp)"
          response="$(mktemp)"
          payload="$(mktemp)"
          trap 'rm -f "$versions" "$response" "$payload"' EXIT
          status="$(curl -sS --max-time 30 -o "$versions" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/tpu-plovdiv-ai-author-v27/versions?per_page=5")"
          echo "Versions HTTP status: $status"
          node - "$versions" "$payload" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.success){console.error('Versions errors:',JSON.stringify(d.errors));process.exit(1)}
          const a=Array.isArray(d.result)?d.result:(d.result?.items||[]);
          const v=a.find(x=>x.id||x.version_id);
          if(!v){console.error('No version returned');process.exit(1)}
          const id=v.id||v.version_id;
          fs.writeFileSync(process.argv[3],JSON.stringify({strategy:'percentage',versions:[{version_id:id,percentage:100}]}));
          console.log('Activating uploaded version');
          NODE
          status="$(curl -sS --max-time 30 -o "$response" -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/tpu-plovdiv-ai-author-v27/deployments" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$payload")"
          echo "Activation HTTP status: $status"
          node - "$response" <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('Activation success:',d.success);
          for(const e of d.errors||[])console.error('Activation error:',e.code,e.message);
          if(!d.success)process.exit(1);
          NODE
      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 \
            "https://tpu-plovdiv-ai-author-v27.emilgergov.workers.dev/health" \
            | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{let d=JSON.parse(s);console.log("Service:",d.service,"Status:",d.status,"AI enabled:",d.aiGenerationEnabled);if(d.status!=="online"||d.service!=="TPU Plovdiv AI Author V27")process.exit(1)})'
      - name: Verify unauthenticated AI requests cannot incur charges
        shell: bash
        run: |
          set -euo pipefail
          base="https://tpu-plovdiv-ai-author-v27.emilgergov.workers.dev"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl -sS --max-time 15 -o "$response" -w '%{http_code}' \
            -X POST "$base/author" -H 'Content-Type: application/json' \
            --data '{"mode":"expert","facts":{"subject":"Synthetic test only","parcelIds":["99999.999.9999"]}}')"
          echo "Unauthenticated AI request HTTP status: $status"
          if [[ "$status" != "401" && "$status" != "503" ]]; then
            echo "::error::AI endpoint did not fail closed"; exit 1
          fi
          node - "$response" <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.error || d.draft){console.error('Unexpected response from protected endpoint');process.exit(1)}
          console.log('Protected AI endpoint rejects unauthenticated requests');
          NODE
