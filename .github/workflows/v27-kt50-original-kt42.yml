name: V27 KT50 original KT42 restore and Pages verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-kt50-original-kt42.yml'
      - 'v26-test/v27-preview/v27-kt50-original-kt42.js'
      - 'v26-test/v27-preview/kt50-original-kt42.html'
      - 'v26-test/v27-preview/kt50-original-kt42-regression.cjs'
      - 'v26-test/v27-preview/etalon/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kt42-original-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOCX regression dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Check source syntax and original approved DOCX fidelity
        shell: bash
        run: |
          set -euo pipefail
          node --check v26-test/v27-preview/v27-kt50-original-kt42.js
          node --check v26-test/v27-preview/kt50-original-kt42-regression.cjs
          node v26-test/v27-preview/kt50-original-kt42-regression.cjs 2>&1 | tee KT50_DOCX_LOG.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KT50-Original-KT42-DOCX-QA
          path: KT50_DOCX_LOG.txt
          if-no-files-found: ignore
      - name: Record original KT42 DOCX results for review
        if: always()
        shell: bash
        run: |
          mkdir -p v26-test/v27-preview
          cp KT50_DOCX_LOG.txt v26-test/v27-preview/KT50_HISTORICAL_DOCX_QA.txt 2>/dev/null || echo 'DOCX checks failed before log collection' > v26-test/v27-preview/KT50_HISTORICAL_DOCX_QA.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v26-test/v27-preview/KT50_HISTORICAL_DOCX_QA.txt
          git commit -m 'KT50: record actual historical DOCX regeneration QA' || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 2
          done
  kt50-pages:
    runs-on: ubuntu-latest
    needs: kt42-original-docx
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Pages loads the exact original KT42 source and 3 unchanged DOCX
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time,hashlib,html
          from pathlib import Path
          base='https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/v27-preview/'
          name='kt50-original-kt42.html'
          loader='v27-preview/v27-kt50-original-kt42.js?v=kt50-original-b1d2cfb'
          expected={'v27-kt50-original-kt42.js':'2c879e0f743f9863051f4126769977e8f1dcf842',
            'etalon/KT35-A.docx':'1a495fc2d6047a6377e48dfb963a737502404087',
            'etalon/KT39-B.docx':'508402ce5a631617bdc0da4ca9d9cd535b6b3b7c',
            'etalon/V27-R02.docx':'335634ab930253671dc090391ed366867ca7e438'}
          def get(url):
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as r: return r.read()
          last=''
          for i in range(30):
            try:
              page=get(base+name+'?check=kt50-original-'+str(i)).decode('utf-8')
              if page.count(loader)!=1: raise RuntimeError('KT50 loader absent or duplicate')
              if 'v27-kt49-kt42-content-bridge.js?' in page: raise RuntimeError('KT49 bridge remains in KT50')
              if '<base href="../">' not in page: raise RuntimeError('GIS resources base changed')
              for filename,blob in expected.items():
                b=get(base+filename+'?kt50sha='+str(i))
                actual=hashlib.sha1(('blob '+str(len(b))).encode()+bytes([0])+b).hexdigest()
                if actual!=blob: raise RuntimeError('Original source / DOCX blob differs: '+filename+' / '+actual)
              print('KT50 LIVE PAGES VERIFIED: exact original pre-KT43 JS and all 3 untouched DOCX; isolated route OK')
              break
            except Exception as e:
              last=str(e)
              if i==29: raise RuntimeError('KT50 Pages not verified: '+last)
              time.sleep(8)
          PY
      - name: Record deployment verification
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('v26-test/v27-preview/KT50_LIVE_VERIFIED.json')
          p.write_text(json.dumps({
             'checkpoint':'KT50','result':'LIVE_PAGES_VERIFIED',
             'kind':'original_pre_KT43_source_restoration_not_general_quality_acceptance',
             'source_commit':'b1d2cfb74abfda26ddc01f4f384e60e3ca54e8c9',
             'source_blob':'2c879e0f743f9863051f4126769977e8f1dcf842',
             'tested_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'visual_url':'https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/v27-preview/kt50-original-kt42.html',
             'checks':['historical DOCX A/B/R02 generation and unrelated case rejection','exact original source JS Git blob','original 3 Word binaries','isolated Pages HTML loader']},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v26-test/v27-preview/KT50_LIVE_VERIFIED.json
          git commit -m 'KT50: verify original KT42 renderer live on isolated Pages' || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 3
          done
