name: V26 isolated zone overlay tests
on:
  push:
    branches: [work/expert-module-isolated-20261020]
    paths:
      - 'expert-module/v26_zone_overlay.py'
      - 'expert-module/v26_batch_analysis.py'
      - 'expert-module/v26_evidence_report.py'
      - 'expert-module/v26_dossier_intake.py'
      - 'expert-module/v26_workflow.py'
      - 'expert-module/v26_evidence_pdf.py'
      - 'expert-module/v26_ci_build.py'
      - 'expert-module/tests/test_zone_overlay.py'
      - 'expert-module/tests/test_v26_batch_analysis.py'
      - 'expert-module/tests/test_v26_evidence_report.py'
      - 'expert-module/tests/test_v26_dossier_intake.py'
      - 'expert-module/tests/test_v26_workflow.py'
      - 'expert-module/tests/test_v26_evidence_pdf.py'
      - '.github/workflows/v26-zone-overlay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS test dependencies
        run: python -m pip install shapely pyproj reportlab
      - name: Run all V26 acceptance tests
        run: python -m unittest discover -s expert-module/tests -p 'test*.py' -v
      - name: Build end-to-end synthetic GIS evidence
        run: python expert-module/v26_ci_build.py
      - name: Upload synthetic PDF, HTML and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-synthetic-evidence
          path: v26-test-output/
          if-no-files-found: warn
          retention-days: 7
