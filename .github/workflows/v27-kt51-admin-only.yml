name: V27 KT51 restored content and isolated Pages verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-kt51-admin-only.yml'
      - 'v26-test/v27-preview/v27-kt51-admin-only.js'
      - 'v26-test/v27-preview/v26-draft-package.js'
      - 'v26-test/v27-preview/kt51-admin-test.html'
      - 'v26-test/v27-preview/kt51-restored-content-regression.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restored-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOCX XML and ZIP dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Check syntax in actual approved authors, bridge and package
        run: |
          node --check v26-test/v27-preview/v27-approved-classic-word-ab.js
          node --check v26-test/v27-preview/v27-approved-expert-word-r02.js
          node --check v26-test/v27-preview/v27-kt51-admin-only.js
          node --check v26-test/v27-preview/v26-draft-package.js
          node --check v26-test/v27-preview/kt51-restored-content-regression.cjs
      - name: Generate actual A/B/R02 DOCX through approved authoring adapters
        run: node v26-test/v27-preview/kt51-restored-content-regression.cjs
      - name: Verify test HTML loads the approved adapters before administrative bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v26-test/v27-preview/kt51-admin-test.html').read_text()
          paths=['v27-preview/v27-approved-classic-word-ab.js','v27-preview/v27-approved-expert-word-r02.js','v27-preview/v27-kt51-admin-only.js?v=kt51-content-restore-6','v27-preview/v26-draft-package.js?v=kt51-content-restore-6']
          for a,b in zip(paths,paths[1:]):
            assert a in s and b in s and s.index(a)<s.index(b),(a,b)
          assert '<base href="../">' in s
          print('KT51 approved generator order PASS')
          PY
  live-pages:
    runs-on: ubuntu-latest
    needs: restored-content
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages contains exact restored script, package and test HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,time,urllib.request
          base='https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/v27-preview/'
          files=['kt51-admin-test.html','v27-kt51-admin-only.js','v26-draft-package.js']
          def digest(x): return hashlib.sha256(x).hexdigest()
          for attempt in range(30):
            try:
              for f in files:
                expected=Path('v26-test/v27-preview',f).read_bytes()
                req=urllib.request.Request(base+f+'?restore-proof='+str(attempt),headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as r: remote=r.read()
                if digest(remote)!=digest(expected): raise RuntimeError('Public file not yet deployed: '+f)
              print('KT51 RESTORED CONTENT LIVE PAGES VERIFIED: exact HTML, approved-author bridge and package.')
              break
            except Exception:
              if attempt==29: raise
              time.sleep(8)
          PY
