name: V27 KT51 locked content and administrative-only deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-kt51-admin-only.yml'
      - 'v26-test/v27-preview/v27-kt51-admin-only.js'
      - 'v26-test/v27-preview/kt51-admin-test.html'
      - 'v26-test/v27-preview/kt51-admin-only-regression.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docx-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM and DOCX ZIP test dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Actual A/B/R02 DOCX content, footer, and verified case tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          {
            node --check v26-test/v27-preview/v27-kt51-admin-only.js &&
            node --check v26-test/v27-preview/kt51-admin-only-regression.cjs &&
            node v26-test/v27-preview/kt51-admin-only-regression.cjs
          } > KT51_ADMIN_DOCX_QA.log 2>&1
          rc=$?
          cat KT51_ADMIN_DOCX_QA.log
          exit "$rc"
      - name: Capture real test results
        if: always()
        shell: bash
        run: |
          mkdir -p v26-test/v27-preview
          cp KT51_ADMIN_DOCX_QA.log v26-test/v27-preview/KT51_ADMIN_DOCX_QA.txt 2>/dev/null || echo "KT51 regression failed before log creation" > v26-test/v27-preview/KT51_ADMIN_DOCX_QA.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v26-test/v27-preview/KT51_ADMIN_DOCX_QA.txt
          git commit -m 'KT51: record actual admin-only DOCX QA' || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 3
          done
  live-pages:
    runs-on: ubuntu-latest
    needs: docx-regression
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated public KT51 HTML, script identity, and original DOCX binaries
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time,hashlib
          from pathlib import Path
          base='https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/v27-preview/'
          loader='v27-preview/v27-kt51-admin-only.js?v=kt51-admin-stable-1'
          expected={'v27-kt51-admin-only.js':'b63882932be814b4253540c2fe98df110831a2a2',
            'etalon/KT35-A.docx':'1a495fc2d6047a6377e48dfb963a737502404087',
            'etalon/KT39-B.docx':'508402ce5a631617bdc0da4ca9d9cd535b6b3b7c',
            'etalon/V27-R02.docx':'335634ab930253671dc090391ed366867ca7e438'}
          def get(url):
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as r: return r.read()
          for i in range(30):
            try:
              html=get(base+'kt51-admin-test.html?proof=kt51-'+str(i)).decode('utf-8')
              if html.count(loader)!=1: raise RuntimeError('KT51 loader absent/duplicate')
              if 'v27-kt49-kt42-content-bridge.js?v=' in html or 'v27-kt50-original-kt42.js?v=' in html: raise RuntimeError('KT51 historic loader collision')
              if '<base href="../">' not in html: raise RuntimeError('KT51 GIS resource base wrong')
              for path,sha in expected.items():
                blob=get(base+path+'?proof=kt51-'+str(i))
                actual=hashlib.sha1(('blob '+str(len(blob))).encode()+bytes([0])+blob).hexdigest()
                if actual!=sha: raise RuntimeError('KT51 Pages source mismatch: '+path+' got '+actual)
              print('KT51 LIVE PAGES VERIFIED: admin-only bridge and all three approved DOCX exactly on GitHub Pages')
              break
            except Exception as e:
              if i==29: raise
              time.sleep(8)
          PY
      - name: Record verified KT51 isolated Pages status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('v26-test/v27-preview/KT51_LIVE_VERIFIED.json')
          p.write_text(json.dumps({
            'checkpoint':'KT51','result':'LIVE_PAGES_VERIFIED',
            'scope':'administrative-only: A confidentiality like B; header, place, recipient; no changes to approved legal/impact bodies',
            'body_source':'KT42 b1d2cfb',
            'visual_url':'https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/v27-preview/kt51-admin-test.html',
            'checks':['real DOCX A/B/R02 regression','synthetic B only with verified complete evidence','approved three original DOCX unchanged','public isolated HTML and JS']},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v26-test/v27-preview/KT51_LIVE_VERIFIED.json
          git commit -m 'KT51: verify admin-only isolated visual test on live Pages' || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 3
          done
