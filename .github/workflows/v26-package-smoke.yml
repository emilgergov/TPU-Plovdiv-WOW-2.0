name: V26.5 test module checks
on:
  push:
    paths:
      - 'v26-test/**'
      - '.github/workflows/v26-package-smoke.yml'
  workflow_dispatch:
jobs:
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in v26-test/*.js; do node --check "$f"; done
          node --check v26-test/tests/package-smoke.cjs
      - name: Test GIS scenarios and ZIP package writer
        run: node v26-test/tests/package-smoke.cjs
