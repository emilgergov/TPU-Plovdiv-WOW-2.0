name: V26.5 test module checks
on:
  push:
    paths:
      - 'v26-test/**'
      - '.github/workflows/v26-package-smoke.yml'
  workflow_dispatch:
jobs:
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in v26-test/*.js; do node --check "$f"; done
          for f in v26-test/tests/*.cjs; do node --check "$f"; done
      - name: Test GIS scenarios and ZIP package writer
        run: node v26-test/tests/package-smoke.cjs
      - name: Install document test dependencies
        run: npm install --no-save --no-package-lock jszip fflate jsdom@26 pdfmake@0.2.20 pdf-parse@1.1.1
      - name: Test document package A/B routing and optional PDF2
        run: node v26-test/tests/document-smoke.cjs
      - name: Test original Word A/B templates
        run: node v26-test/tests/word-real-templates.cjs
      - name: Test PDF1 and PDF2 V26.8 evidence and settlement contracts
        run: node v26-test/tests/v26-8-annex-contract.cjs
      - name: Render and parse real PDF1 and PDF2
        run: node v26-test/tests/v26-8-real-pdf.cjs
      - name: Generate and inspect complete real ZIP packages for A and B
        run: node v26-test/tests/v26-8-full-real-zip.cjs
