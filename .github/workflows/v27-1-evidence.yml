name: V27.1 Evidence Registry Tests
on:
  push:
    branches:
      - planning/WOW-V27-1-AI-END-TO-END
    paths:
      - 'v26-test/v27-case-evidence.js'
      - 'v26-test/v27-case-evidence.test.cjs'
      - 'v26-test/v27-dossier-batches.js'
      - 'v26-test/v27-dossier-batches.test.cjs'
      - 'v26-test/v27-early-subject.js'
      - 'v26-test/v27-early-subject.test.cjs'
      - 'v26-test/v27-early-server.test.cjs'
      - 'v26-test/v27-early-integration.test.cjs'
      - 'v26-test/v27-early-race.test.cjs'
      - 'v26-test/v26-browser-zip-inventory.js'
      - 'v26-test/v27-multi-parcel-map.js'
      - 'v26-test/v27-multi-parcel-map.test.cjs'
      - 'v26-test/v27-verified-context.js'
      - 'v26-test/v27-verified-context.test.cjs'
      - 'v26-test/v27-expert-evidence.js'
      - 'v26-test/v27-expert-evidence.test.cjs'
      - 'v26-test/v27-expert-integration.test.cjs'
      - 'v26-test/v27-draft-quality.js'
      - 'v26-test/v27-draft-quality.test.cjs'
      - 'v26-test/v27-contract-test.cjs'
      - 'v26-test/v27-zip-manifest.test.cjs'
      - 'v26-test/v27-zip-binary.test.cjs'
      - 'v26-test/v26-draft-package.js'
      - 'v26-test/v27-early-subject-bridge.js'
      - 'v26-test/index.html'
      - 'cloudflare/ai-author-v27/src/early-subject.js'
      - 'cloudflare/ai-author-v27/src/worker.js'
      - 'cloudflare/ai-author-v27/test/provenance-contract.cjs'
      - 'cloudflare/ai-author-v27/test/v27-1-e2e-mock.cjs'
      - '.github/workflows/v27-1-evidence.yml'
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source grounding and conflict detection
        run: |
          node v26-test/v27-case-evidence.test.cjs
          node v26-test/v27-dossier-batches.test.cjs
          node v26-test/v27-early-subject.test.cjs
          node v26-test/v27-early-server.test.cjs
          node v26-test/v27-early-integration.test.cjs
          node v26-test/v27-early-race.test.cjs
          node v26-test/v27-multi-parcel-map.test.cjs
          node v26-test/v27-verified-context.test.cjs
          node v26-test/v27-expert-evidence.test.cjs
          node v26-test/v27-expert-integration.test.cjs
          node v26-test/v27-draft-quality.test.cjs
          node v26-test/v27-contract-test.cjs
          node v26-test/v27-zip-manifest.test.cjs
          node v26-test/v27-zip-binary.test.cjs
          node cloudflare/ai-author-v27/test/provenance-contract.cjs
          node cloudflare/ai-author-v27/test/v27-1-e2e-mock.cjs
