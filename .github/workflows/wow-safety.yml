name: WOW navigation safety check
on:
  push:
    branches:
      - fix/simplify-tree-navigation-20261018
  pull_request:
    paths:
      - 'index.html'
      - 'WOW_APP.html'
      - 'tests/**'
      - '.github/workflows/wow-safety.yml'
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run existing WOW navigation regression tests
        run: node tests/wow-navigation.mjs
      - name: Preserve test results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-navigation-results
          path: wow-test-results/
          if-no-files-found: ignore
