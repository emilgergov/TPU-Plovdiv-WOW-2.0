name: KT134 — Preflight existing protected KT133 Worker (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kt134-kt133-protected-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect protected Worker metadata only; do not alter production
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::GitHub Cloudflare token unavailable"; exit 1; }
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/kt133-tpu-plovdiv-kt125-local-auth"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $CF_TOKEN" "$url" -o "$RUNNER_TEMP/kt133-worker-response"
          size=$(wc -c < "$RUNNER_TEMP/kt133-worker-response")
          if [ "$size" -lt 10000 ]; then echo "::error::Worker source unexpectedly small ($size bytes)"; exit 1; fi
          # Do not echo protected source or upload artifact; only report its size.
          echo "READ PASS: KT133 Worker source is available ($size bytes)."
      - name: Inspect bindings, report only categories and safe counts
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/kt133-tpu-plovdiv-kt125-local-auth/settings"
          status=$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/settings.json" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$url")
          if [ "$status" != 200 ]; then echo "::error::Cannot inspect Worker settings; HTTP $status"; exit 1; fi
          node - "$RUNNER_TEMP/settings.json" <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.success)throw Error('Cannot verify KT133 Worker settings');
          const b=d.result?.bindings || [];
          const summary={};
          for(const item of b)summary[item.type]=(summary[item.type]||0)+1;
          console.log('KT133 binding categories:',JSON.stringify(summary));
          console.log('Inspect-only: NO secrets, names, IDs, database values or source content are printed.');
          NODE
      - name: Confirm no change occurred
        run: echo 'READ ONLY / no Cloudflare deployment, migration or D1 writes.'
