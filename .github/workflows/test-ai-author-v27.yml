name: Test AI Author V27 (no secrets, no paid API)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ai-author-v27/src/worker.js'
      - 'cloudflare/ai-author-v27/src/kt123-*.mjs'
      - 'cloudflare/ai-author-v27/src/legal-v11-loader.mjs'
      - 'cloudflare/ai-author-v27/src/legal-v11/**'
      - 'cloudflare/ai-author-v27/test/**'
      - 'v26-test/v27-ai-*.js'
      - 'v26-test/v26-expert-draft.js'
      - 'v26-test/v26-expert-word.js'
      - 'v26-test/v26-draft-package.js'
      - 'v26-test/index.html'
      - '.github/workflows/test-ai-author-v27.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated AI Author tests
        run: |
          node cloudflare/ai-author-v27/test/kt105-legal-corpus.mjs
          node cloudflare/ai-author-v27/test/kt105-abc-integration.mjs
          node cloudflare/ai-author-v27/test/author-smoke.mjs
          node cloudflare/ai-author-v27/test/kt123-stage4-stage5-coherence.mjs
          node cloudflare/ai-author-v27/test/kt123-decision-exhaustive.mjs
          node cloudflare/ai-author-v27/test/kt123-substance-guard.mjs
          node cloudflare/ai-author-v27/test/kt123-source-qualification-handoff.mjs
          node cloudflare/ai-author-v27/test/kt124-independent-expert-handoff.mjs
          node --check vt03/kt80/integration/kt124-expert-authority.mjs
          node --check vt03/kt80/integration/kt116-expert-approval-handoff.mjs
          node --check vt03/kt80/integration/kt117-stage5-document-author.mjs
      - name: Check Stage 4 browser module syntax and UTF-8 payload contract
        run: |
          node --check vt03/kt80/integration/kt96-eg-ai-stage4-author.mjs
          node cloudflare/ai-author-v27/test/stage4-size-regression.mjs
          node cloudflare/ai-author-v27/test/stage4-entry-regression.mjs
          node --input-type=module -e "import {readFileSync} from 'node:fs';const h=readFileSync('vt03/kt80/KT83_VT02_P1_P6_VISUAL_TEST.html','utf8');if(!h.includes('kt96-eg-ai-stage4-author.mjs?v='))process.exit(1);console.log('PASS: fresh Stage 4 asset cache version');"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const s=readFileSync('vt03/kt80/integration/kt96-eg-ai-stage4-author.mjs','utf8'); for(const term of ['TextEncoder','fitStage4Request','stageBytes(req)','prepared.payload'])if(!s.includes(term))process.exit(1); console.log('PASS: Stage 4 source includes UTF-8 size limits before network calls');"

