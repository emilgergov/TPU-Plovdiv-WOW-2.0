name: Publish isolated V26 browser preview
on:
  workflow_dispatch:
  push:
    branches: [work/v26-auto-word-evidence-20261028]
    paths:
      - 'expert-v26/**'
      - '.github/workflows/v26-preview-pages.yml'
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: main
          path: public
          persist-credentials: true
      - name: Check V26 JavaScript and published geometry
        run: |
          node --check source/expert-v26/v26-browser-gis.js
          node --check source/expert-v26/v26-word-review.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/expert-v26/gis-data')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['status']=='PASS_COUNT_BY_PREFIX'
          assert manifest['parcel_geometry']==917418
          assert manifest['overlap_records_expected']==181154
          assert manifest['shards']==258
          for prefix in ('36','47'):
            assert (root/f'parcelgeom_{prefix}.json.gz').is_file()
          shards=list(root.glob('*.json.gz'))
          assert len(shards)==258, f'Incomplete GIS dataset: {len(shards)}/258 shards'
          print('Complete GIS package verified: 258 shards')
          PY
      - name: Publish isolated folder without changing existing WOW
        run: |
          mkdir -p public/v26-test
          rsync -a --exclude='gis-data/' source/expert-v26/ public/v26-test/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v26-test/v26-full-gis-bridge.js')
          s=p.read_text(encoding='utf-8').replace("api.openHosted('./gis-data')", "api.openHosted('../expert-v26/gis-data')")
          p.write_text(s,encoding='utf-8')
          PY
          test -s public/v26-test/index.html
          test -s public/expert-v26/gis-data/manifest.json
          test "$(find public/expert-v26/gis-data -name '*.json.gz' | wc -l)" -eq 258
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v26-test
          if git diff --cached --quiet; then echo 'No preview changes'; exit 0; fi
          git commit -m 'Update isolated V26 preview (keep WOW unchanged)'
          git push origin HEAD:main
