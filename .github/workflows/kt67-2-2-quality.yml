name: KT67-2.2 real B quality and immutable DOCX checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kt67-2-2-quality.yml'
      - 'v26-test/v27-preview/kt67-2-2-*'
      - 'v26-test/v27-preview/kt67-2-original-word-auto-project-test.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Original KT56 content replay
        run: node v26-test/v27-preview/kt62-locked-replay-regression.cjs
      - name: KT68 inspect approved DOCX run-by-run bold typography
        run: |
          node - <<'JS'
          const fs=require('node:fs'),fflate=require('fflate'),{DOMParser}=require('@xmldom/xmldom');
          const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
          const all=(el,n)=>Array.from(el.getElementsByTagNameNS(ns,n));
          for(const name of ['KT35-A','KT39-B','V27-R02']){
            const zip=fflate.unzipSync(new Uint8Array(fs.readFileSync('v26-test/v27-preview/etalon/'+name+'.docx')));
            const doc=new DOMParser().parseFromString(new TextDecoder().decode(zip['word/document.xml']),'application/xml');
            const ps=Array.from(all(doc,'body')[0].childNodes).filter(x=>x.nodeType===1&&x.localName==='p');
            console.log('KT68 FONT AUDIT',name,'paragraphs',ps.length);
            for(let i=0;i<ps.length;i++){
              if(i!==10&&i!==6&&i!==7&&i!==16&&i!==17&&i!==23&&i!==31&&i!==39)continue;
              const runs=Array.from(ps[i].childNodes).filter(x=>x.nodeType===1&&x.localName==='r').map(r=>{
                const t=all(r,'t').map(x=>x.textContent).join('');
                if(!t)return null;
                const bp=all(r,'b')[0];
                return {text:t.slice(0,115),length:t.length,bold:bp?bp.getAttributeNS(ns,'val')!=='0':false};
              }).filter(Boolean);
              console.log(JSON.stringify({name,paragraph:i,runs}));
            }
          }
          JS
      - name: KT68 validate real DOCX subject bold segments and spatial prose for A/B/R02
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm'),fflate=require('fflate');
          const {DOMParser,XMLSerializer}=require('@xmldom/xmldom');
          const demo=new DOMParser().parseFromString('<r><x/></r>','application/xml').documentElement;
          Object.defineProperty(Object.getPrototypeOf(demo),'children',{configurable:true,get(){return Array.from(this.childNodes||[]).filter(n=>n.nodeType===1)}});
          const window={fflate};
          vm.runInNewContext(fs.readFileSync('v26-test/v27-preview/kt67-2-2-spatial-slot.js','utf8'),{window,DOMParser,XMLSerializer,TextDecoder,TextEncoder,Blob});
          const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
          const parse=bytes=>new DOMParser().parseFromString(new TextDecoder().decode(fflate.unzipSync(bytes)['word/document.xml']),'application/xml');
          const paragraphs=doc=>Array.from(doc.getElementsByTagNameNS(ns,'body')[0].children).filter(p=>p.localName==='p');
          const text=p=>Array.from(p.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent).join('');
          const bold=r=>{const bp=r.getElementsByTagNameNS(ns,'b')[0];return !!bp&&bp.getAttributeNS(ns,'val')!=='0';};
          const cases=[
           ['А',['56784.13.102','56784.13.105','56784.13.106'],'KT35-A','classic'],
           ['А',['56784.13.102','56784.13.105','56784.13.106'],'V27-R02','expert'],
           ['Б',['36676.129.457'],'KT39-B','classic'],
           ['Б',['36676.129.457'],'V27-R02','expert'],
           ['А',['56784.13.102'],'KT35-A','classic'],
           ['А',['56784.13.102'],'V27-R02','expert']
          ];
          for(const [scenario,ids,fixture,kind] of cases){
            const original=fflate.unzipSync(new Uint8Array(fs.readFileSync('v26-test/v27-preview/etalon/'+fixture+'.docx')));
            const xml=new DOMParser().parseFromString(new TextDecoder().decode(original['word/document.xml']),'application/xml');
            const ps=paragraphs(xml),spatialIndex=kind==='expert'?23:scenario==='А'?22:23;
            const candidate='Относно: Уведомление за инвестиционно предложение (ИП): „Тестов казус“ в поземлени имоти с идентификатори '+ids.join(', ')+'.';
            const ts=Array.from(ps[10].getElementsByTagNameNS(ns,'t'));
            ts[0].textContent=candidate;for(let i=1;i<ts.length;i++)ts[i].textContent='';
            const variable=ps[spatialIndex].getElementsByTagNameNS(ns,'t');
            const originalSpatial=scenario==='А'
              ?'Поземлените имоти с идентификатори '+ids.join(', ')+' не попадат в границите на защитени зони.'
              :'За имотите с идентификатори '+ids.join(', ')+' е установено пространствено пресичане със защитена зона BG0000194.';
            variable[0].textContent=originalSpatial;for(let i=1;i<variable.length;i++)variable[i].textContent='';
            original['word/document.xml']=new TextEncoder().encode(new XMLSerializer().serializeToString(xml));
            const before=paragraphs(parse(fflate.zipSync(original))).map(text);
            const updated=window.KT6722SpatialFix.formatGeneratedWord(fflate.zipSync(original),
              {scenario,parcelIds:ids,zoneCodes:scenario==='Б'?['BG0000194']:[],kind});
            const after=paragraphs(parse(updated));
            const t=after[10],runs=Array.from(t.childNodes).filter(x=>x.nodeType===1&&x.localName==='r');
            const actual=runs.filter(x=>text(x)).map(x=>({value:text(x),bold:bold(x)}));
            assert.equal(actual.length,4,fixture+' '+scenario+' subject run count');
            assert.deepEqual(actual.map(x=>x.bold),[true,false,true,false],fixture+' '+scenario+' bold structure');
            assert.equal(text(t).replace(/в поземлен имот с идентификатор/u,'в поземлени имоти с идентификатори').replace('„Тестов казус“','„Тестов казус“'),candidate,
              'Subject content preserved except expected singular normalization');
            assert(text(after[spatialIndex]).includes(scenario==='А'?'не попад':'попад'),kind+' '+scenario+' spatial language');
            if(scenario==='Б')assert(!text(after[spatialIndex]).includes('е установено пространствено пресичане'));
            const mutable=new Set([10,spatialIndex,...(scenario==='Б'?[24]:[])]);
            for(let i=0;i<after.length;i++)if(!mutable.has(i))assert.equal(text(after[i]),before[i],fixture+' paragraph '+i+' changed');
            const files=fflate.unzipSync(updated);
            for(const entry of Object.keys(original))if(entry!=='word/document.xml')assert.deepEqual(files[entry],original[entry],entry+' changed');
            console.log('KT68 WORD TYPOGRAPHY PASS',fixture,scenario,ids.length,'subject bold [1,0,1,0]');
          }
          JS
      - name: Syntax and normalized factual fields
        run: |
          node --check v26-test/v27-preview/kt67-2-2-case-normalize.js
          node --check v26-test/v27-preview/kt67-2-2-spatial-slot.js
          node --check v26-test/v27-preview/kt67-2-2-legal-quality.js
          node - <<'JS'
          const assert=require('node:assert/strict'),vm=require('node:vm'),fs=require('node:fs');
          const window={};vm.runInNewContext(fs.readFileSync('v26-test/v27-preview/kt67-2-2-case-normalize.js','utf8'),{window});
          const a=window.KT6722CaseNormalize;
          const subject='„Изграждане на малък едноетажен обслужващ обект“ в ПИ с идентификатор 36676.129.457, населено място с. Катуница, местност Попското';
          assert.equal(a.title(subject),'Изграждане на малък едноетажен обслужващ обект');
          const p=a.characterization('Инвестиционното предложение включва изграждане на едноетажен обект с площ около 40 кв.м.');
          assert.equal(p,'С реализацията на инвестиционното предложение се предвижда изграждане на едноетажен обект с площ около 40 кв.м.');
          assert.equal(a.characterization(p),p);
          const fromZip14=a.characterization('Инвестиционното предложение обхваща изграждане на малък едноетажен обслужващ обект с временна площадка.');
          assert.equal(fromZip14,'С реализацията на инвестиционното предложение се предвижда изграждане на малък едноетажен обслужващ обект с временна площадка.');
          assert.equal(a.characterization(fromZip14),fromZip14);
          const v=a.normalize({metadata:{subject},paragraphs:[p,'Електрозахранване','Водоснабдяване','Отпадъчни води']});
          assert.equal(v.metadata.subject,'Изграждане на малък едноетажен обслужващ обект');
          assert.equal(v.paragraphs[0],p);
          console.log('KT67-2.2 TITLE/CHARACTERIZATION PASS');
          JS
      - name: Reject unverified legal conclusions and impact order mismatches
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const window={};vm.runInNewContext(fs.readFileSync('v26-test/v27-preview/kt67-2-2-legal-quality.js','utf8'),{window});
          const api=window.KT6722LegalQuality;
          const base={expert:{legal:['Наличните сведения изискват проверка на приложимите нормативни условия, без окончателно произнасяне.'],procedure:['Преценката на компетентния орган зависи от конкретните технически характеристики и проверения режим.'],impacts:['Въвеждаща оценка на вероятните последствия.','Природните местообитания изискват пространствена проверка.','Въздействието върху видовете и безпокойството подлежи на преценка.','Целостта на зоната и целите на опазване следва да бъдат разгледани.','Свързаността между обектите трябва да се отчете.','Кумулативните въздействия с други инвестиционни предложения се анализират.']},provenance:{verifiedProvisionCount:0}};
          assert.equal(api.inspect(base).ok,true);
          const legal={...base,expert:{...base.expert,legal:['Тъй като имотът е в защитена зона, е необходима оценка за съвместимост.']}};
          assert(api.inspect(legal).issues.some(x=>x.code==='UNSUPPORTED_CATEGORICAL_OS'));
          for(const claim of [
            'Пресичането със зона, което предполага необходимост от извършване на съвместимостна оценка.',
            'Съвместимостната оценка е препоръчителна, тъй като имотът попада в защитена зона.'
          ]){
            const unverified={...base,expert:{...base.expert,legal:[claim]}};
            assert(api.inspect(unverified).issues.some(x=>x.code==='UNSOURCED_PROCEDURE_INFERENCE'),claim);
          }
          // Spatial overlap may demand a procedural APPLICABILITY review; it must not
          // be conflated with a mandatory appropriate assessment finding.
          const proceduralReview={...base,expert:{...base.expert,legal:[
            'Тъй като имотът попада в границите на защитена зона Натура 2000, обстоятелството изисква преценка на приложимата процедура по Наредбата за ОС, без автоматичен извод за необходимост от оценка за съвместимост.'
          ]}};
          assert.equal(api.inspect(proceduralReview).ok,true,'B procedural applicability review is not an unsupported assessment order');
          const binding={...base,expert:{...base.expert,legal:[
            'Тъй като имотът попада в защитена зона Натура 2000, това изисква провеждане на оценка за съвместимост.'
          ]}};
          assert(api.inspect(binding).issues.some(x=>x.code==='UNSOURCED_PROCEDURE_INFERENCE'),'Unverified mandatory OS must remain blocked');
          const found=api.inspect(binding).issues.find(x=>x.code==='UNSOURCED_PROCEDURE_INFERENCE');
          assert(found.excerpt.includes('изисква провеждане'),'Actionable offending excerpt must be recorded');
          const conditional={...base,expert:{...base.expert,procedure:['Необходимо е да се провери дали са изпълнени предпоставките за преценка на приложимата процедура по Наредбата за ОС.']}};
          assert.equal(api.inspect(conditional).ok,true,'Conditional project wording must remain possible');
          const cited={...base,expert:{...base.expert,legal:['Съгласно чл. 30 се въвеждат задължителни условия.']}};
          assert.equal(api.inspect(cited).ok,true,'Unverified provision in a draft must not block ZIP');
          assert(api.inspect(cited).warnings.some(x=>x.code==='UNVERIFIED_ARTICLE'&&x.reviewRequired===true));
          const categoricalCited={...base,expert:{...base.expert,legal:['Съгласно чл. 30 е необходима оценка за съвместимост.']}};
          assert.equal(api.inspect(categoricalCited).ok,false,'A citation cannot justify unsupported categorical procedure');
          assert(api.inspect(categoricalCited).issues.some(x=>x.code==='UNSUPPORTED_CATEGORICAL_OS'));
          const verified={...cited,provenance:{verifiedProvisionCount:1}};
          assert(!api.inspect(verified).warnings.some(x=>x.code==='UNVERIFIED_ARTICLE'));
          const mixed={...base,expert:{...base.expert,impacts:[...base.expert.impacts.slice(0,2),'Екологичната целост и целите на опазване са важни.',...base.expert.impacts.slice(3)]}};
          assert(api.inspect(mixed).warnings.some(x=>x.code==='IMPACT_TOPIC_REVIEW') || api.inspect(mixed).issues.some(x=>x.code==='IMPACT_TOPIC_SWAP'));
          const validParaphrase={...base,expert:{...base.expert,impacts:[...base.expert.impacts.slice(0,3),'Във връзка с предмета на опазване на зоната може да се обсъди влиянието върху защитените природни ценности, без категорично твърдение.',...base.expert.impacts.slice(4)]}};
          assert.equal(api.inspect(validParaphrase).ok,true, 'Valid prose must not be blocked merely because a keyword is missing');
          const swapped={...base,expert:{...base.expert,impacts:[base.expert.impacts[0],base.expert.impacts[1],base.expert.impacts[2],base.expert.impacts[4],base.expert.impacts[3],base.expert.impacts[5]]}};
          assert(api.inspect(swapped).issues.some(x=>x.code==='IMPACT_TOPIC_SWAP'),'Unambiguous reciprocal topic swap must block');
          
          const language={...base,expert:{...base.expert,legal:['Необходимо е съдебно-юридическо преценяване на обекта.']}};
          assert(api.inspect(language).issues.some(x=>x.code==='INAPPROPRIATE_LEGAL_LANGUAGE'));
          console.log('KT67-2.2 LEGAL/IMPACTS NEGATIVE TESTS PASS');
          JS
      - name: Verify spatial correction only changes the variable Classic B GIS slot
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),fflate=require('fflate');
          const {DOMParser,XMLSerializer}=require('@xmldom/xmldom');
          const demo=new DOMParser().parseFromString('<r><x/><y/></r>','application/xml').documentElement;
          Object.defineProperty(Object.getPrototypeOf(demo),'children',{configurable:true,get(){return Array.from(this.childNodes||[]).filter(n=>n.nodeType===1)}});
          const window={fflate};vm.runInNewContext(fs.readFileSync('v26-test/v27-preview/kt67-2-2-spatial-slot.js','utf8'),{window,DOMParser,XMLSerializer,TextDecoder,TextEncoder,Blob});
          const original=fflate.unzipSync(new Uint8Array(fs.readFileSync('v26-test/v27-preview/etalon/KT39-B.docx')));
          const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
          const xml=new DOMParser().parseFromString(new TextDecoder().decode(original['word/document.xml']),'application/xml');
          const paras=Array.from(xml.getElementsByTagNameNS(ns,'body')[0].children).filter(e=>e.localName==='p');
          const t=paras[24].getElementsByTagNameNS(ns,'t');t[0].textContent='Пресичащи се защитени зони: . Конкретните режими подлежат на проверка.';for(let i=1;i<t.length;i++)t[i].textContent='';
          original['word/document.xml']=new TextEncoder().encode(new XMLSerializer().serializeToString(xml));
          const source=fflate.zipSync(original);
          const updated=window.KT6722SpatialFix.patchWord(source,['BG0000194']);
          const changed=fflate.unzipSync(updated);
          for(const n of Object.keys(original))if(n!=='word/document.xml')assert.deepEqual(changed[n],original[n],n+' altered');
          const updatedXML=new DOMParser().parseFromString(new TextDecoder().decode(changed['word/document.xml']),'application/xml');
          const pp=Array.from(updatedXML.getElementsByTagNameNS(ns,'body')[0].children).filter(e=>e.localName==='p');
          const ss=pp.map(p=>Array.from(p.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent).join(''));
          assert.match(ss[24],/Пресичащи се защитени зони: BG0000194\./u);
          assert.equal(ss.length,43);
          for(let i=0;i<43;i++)if(i!==24)assert.equal(ss[i],paras[i].getElementsByTagNameNS(ns,'t').length?Array.from(paras[i].getElementsByTagNameNS(ns,'t')).map(x=>x.textContent).join(''):'',i+' changed');
          console.log('KT67-2.2 SINGLE GIS VARIABLE SLOT PASS');
          JS
      - name: KT68 protect Classic A confidentiality positioning using approved B
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),fflate=require('fflate');
          const {DOMParser,XMLSerializer}=require('@xmldom/xmldom');
          const d=new DOMParser().parseFromString('<r><x/></r>','application/xml').documentElement;
          Object.defineProperty(Object.getPrototypeOf(d),'children',{configurable:true,get(){return Array.from(this.childNodes||[]).filter(n=>n.nodeType===1)}});
          const window={fflate};
          vm.runInNewContext(fs.readFileSync('v26-test/v27-preview/kt67-2-2-spatial-slot.js','utf8'),{window,DOMParser,XMLSerializer,TextDecoder,TextEncoder,Blob});
          const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
          const doc=zip=>new DOMParser().parseFromString(new TextDecoder().decode(zip['word/document.xml']),'application/xml');
          const paras=xml=>Array.from(xml.getElementsByTagNameNS(ns,'body')[0].children).filter(x=>x.localName==='p');
          const value=p=>Array.from(p.getElementsByTagNameNS(ns,'t')).map(x=>x.textContent).join('');
          const A=fflate.unzipSync(new Uint8Array(fs.readFileSync('v26-test/v27-preview/etalon/KT35-A.docx')));
          const B=fflate.unzipSync(new Uint8Array(fs.readFileSync('v26-test/v27-preview/etalon/KT39-B.docx')));
          const oldA=paras(doc(A)),originalTexts=oldA.map(value);
          const patched=fflate.unzipSync(window.KT6722SpatialFix.patchClassicAHeader(fflate.zipSync(A)));
          for(const entry of Object.keys(A))if(entry!=='word/document.xml')assert.deepEqual(patched[entry],A[entry],entry+' changed');
          const outA=paras(doc(patched)),baseB=paras(doc(B));
          assert.deepEqual(outA.map(value),originalTexts,'No text may change');
          assert.equal(outA.length,oldA.length);
          for(let i=0;i<2;i++){
            assert.equal(value(outA[i]),value(baseB[i]),'Approved B label must match');
            for(const prop of ['jc','ind','spacing']){
              const get=(p)=>Array.from(p.getElementsByTagNameNS(ns,prop))[0];
              const attrs=x=>Array.from(x.attributes).filter(a=>a.namespaceURI===ns).map(a=>[a.localName,a.value]).sort((a,b)=>a[0].localeCompare(b[0]));
              assert.deepEqual(attrs(get(outA[i])),attrs(get(baseB[i])),prop+' mismatch B at '+i);
            }
          }
          for(let i=2;i<outA.length;i++)assert.equal(value(outA[i]),value(oldA[i]),'Body '+i+' altered');
          assert.equal(value(baseB[0]),'Ниво на конфиденциалност 0');
          assert.equal(value(baseB[1]),'[TLP-WHITE]');
          console.log('KT68 CLASSIC A confidential labels aligned to approved B; no DOCX contents changed PASS');
          JS
      - name: Validate real browser pipeline order without replacing approved writers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v26-test/v27-preview/kt67-2-original-word-auto-project-test.html').read_text()
          assert 'KT6722LegalQuality?.inspect(kt67Plan)' in s
          assert 'KT6722CaseNormalize.normalize' in s
          assert 'KT6722SpatialFix.fix(initialBlob' in s
          assert s.index('KT6722LegalQuality?.inspect')<s.index('V26DraftPackage.make')
          assert s.index('KT6722SpatialFix.fix')<s.index('KT57PackageQA.verify')
          assert 'KT66ExpertReview.create' not in s
          assert 'v27-kt50-original-kt42.js?v=kt603-original-locked-b1d2cfb' in s
          print('KT67-2.2 BROWSER PIPELINE PASS')
          PY
