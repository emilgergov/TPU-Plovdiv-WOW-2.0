name: V27 synchronize AI access (no manual token copying)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-sync-ai-access.yml'
permissions:
  contents: read
jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AI_ACCESS: ${{ secrets.AI_AUTHOR_ACCESS_TOKEN }}
      CF_ACCOUNT: 90df5489417e4b53179a852c446aeed1
      WORKER: tpu-plovdiv-ai-author-v27
    steps:
      - name: Ensure required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Missing Cloudflare deployment credential"; exit 1; }
          test -n "$AI_ACCESS" || { echo "::error::Missing GitHub AI access secret"; exit 1; }
      - name: Synchronize existing GitHub AI access secret into Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$payload" "$response"' EXIT
          node - "$payload" <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({name:'AI_AUTHOR_ACCESS_TOKEN',text:process.env.AI_ACCESS,type:'secret_text'}),{mode:0o600});
          NODE
          status="$(curl --silent --show-error --max-time 30 -o "$response" -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER/secrets" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" --data-binary "@$payload")"
          echo "Cloudflare secret sync HTTP: $status"
          node - "$response" <<'NODE'
          const fs=require('node:fs');
          let d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.success){for(const e of d.errors||[])console.error('Cloudflare:',e.code,e.message);process.exit(1)}
          console.log('AI access secret synchronized; value not printed');
          NODE
          [[ "$status" == "200" || "$status" == "201" ]]
      - name: Verify AI access without incurring an OpenAI request
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 20 -o "$response" -w '%{http_code}' \
            -X POST "https://tpu-plovdiv-ai-author-v27.emilgergov.workers.dev/author" \
            -H "Authorization: Bearer $AI_ACCESS" -H 'Content-Type: application/json' \
            --data '{"mode":"expert","facts":{}}')"
          echo "Authenticated invalid-payload check HTTP: $status"
          if [[ "$status" != "400" ]]; then echo "::error::AI access not yet accepted (expected 400 after auth, without paid AI call)"; exit 1; fi
          echo 'AI authorization PASS. Real document generation still requires live AI acceptance.'
