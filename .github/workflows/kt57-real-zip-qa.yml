name: KT57 integrated real ZIP and locked Word QA
on:
  push:
    branches: [main]
    paths:
      - 'v26-test/v27-preview/kt57-unified-real-zip-qa-test.html'
      - 'v26-test/v27-preview/kt57-locked-package-qa.js'
      - 'v26-test/v27-preview/kt66-locked-content-qa.js'
      - '.github/workflows/kt57-real-zip-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOCX regression dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Original A B R02 regression and scripts
        run: |
          node --check v26-test/v27-preview/kt57-locked-package-qa.js
          node --check v26-test/v27-preview/v27-kt50-original-kt42.js
          node v26-test/v27-preview/kt50-original-kt42-regression.cjs
      - name: KT68 precise placeholder regression for Classic and Expert Word
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const sandbox={window:{}};vm.runInNewContext(fs.readFileSync('v26-test/v27-preview/kt57-locked-package-qa.js','utf8'),sandbox);
          const problem=sandbox.window.KT57PackageQA.problem;
          for(const t of [
            'Няма данни за потвърдени текстове от нормативния архив и правните основания подлежат на експертна проверка.',
            'В преписката няма данни относно електрозахранването.',
            'Няма данни за съпътстващи имоти.'
          ])assert.equal(problem(t),'',t);
          for(const t of ['НЯМА ДАННИ','Няма данни в преписката','[[LEGAL]]','[ЗА ЕКСПЕРТНА ПРОВЕРКА — въздействия]'])
            assert(problem(t),t);
          assert(fs.readFileSync('v26-test/v27-preview/kt66-locked-content-qa.js','utf8').includes('^НЯМА ДАННИ'));
          console.log('KT68 valid no-data prose allowed; standalone placeholders still blocked PASS');
          JS
      - name: Confirm final ZIP is guarded before download
        shell: python
        run: |
          from pathlib import Path
          h=Path('v26-test/v27-preview/kt57-unified-real-zip-qa-test.html').read_text()
          q=Path('v26-test/v27-preview/kt57-locked-package-qa.js').read_text()
          assert 'kt57-locked-package-qa.js?v=kt57-v1' in h
          assert 'await window.KT57PackageQA.verify(blob,' in h
          assert h.index('const url=URL.createObjectURL(blob)',h.index('await window.KT57PackageQA.verify(blob,'))>h.index('await window.KT57PackageQA.verify(blob,')
          assert 'v27-kt50-original-kt42.js?v=kt57-original-locked-b1d2cfb' in h
          assert 'kt53-original-draft-package.js?v=kt57-original-locked-b1d2cfb' in h
          assert 'kt53d-b-characterization-word.js' not in h
          for required in ['KT35-A','KT39-B','V27-R02','01_Proekt_na_stanovishte_Klasicheski.docx','02_Proekt_na_stanovishte_Eksperten.docx']:
            assert required in q
          print('KT57 unmodified originals and pre-download Word QA PASS')
