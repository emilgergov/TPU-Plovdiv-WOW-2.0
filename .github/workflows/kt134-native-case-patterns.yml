name: KT134 authenticated KT125 route patterns audit
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-native-case-patterns.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - name: Inspect routing syntax only, no user data or private source export
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/tpu-plovdiv-kt125-local-auth',{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
          if(!r.ok)throw Error('NATIVE_NOT_AVAILABLE');
          const s=await r.text();
          const anchors=['^/kt125/cases/','^/kt126/registry/','^/kt126/registry','/state','/part/','/finish','/start'];
          const report=anchors.map(anchor=>{
            const hits=[];let pos=0;
            for(let n=0;n<15;n++){
              const i=s.indexOf(anchor,pos);if(i<0)break;pos=i+anchor.length;
              const segment=s.slice(Math.max(0,i-200),i+620);
              // Public route fragments only; do not retain SQL, private body, or secret values.
              const literals=[...segment.matchAll(/["'`]([^"'`]{1,130})["'`]/g)].map(m=>m[1])
                .filter(v=>/^(\^?\/|GET$|POST$|PATCH$|PUT$|DELETE$|state$|files$|version$|start$|finish$|parts?$|registry$|cases$)/.test(v))
                .filter(v=>!/(?:password|token|secret|authorization|cookie)/i.test(v)).slice(0,14);
              const tokens=['GET','POST','PUT','PATCH','DELETE','readState','writeState','readRegistry','fetch','caseId','revision','fileId','sourceId','source_id','case_id','content_json','responseJson','jsonResponse']
                .filter(t=>new RegExp('\\b'+t+'\\b').test(segment));
              const routeRegex=[...segment.matchAll(/new RegExp\(([^\n]{1,250})/g)].map(m=>m[1].slice(0,170))
                .filter(t=>/kt125|kt126|cases|registry/.test(t)).slice(0,5);
              hits.push({literals:[...new Set(literals)],tokens,routeRegex});
            }
            return {anchor,hits};
          });
          writeFileSync('kt134-auto/KT134_KT125_ROUTE_PATTERNS.json',
            JSON.stringify({readOnly:true,backendSourceNotExported:true,report},null,2)+'\n');
          console.log('KT134: native case routing metadata captured');
          NODE
      - name: Save route metadata on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kt134-auto/KT134_KT125_ROUTE_PATTERNS.json
          git commit -m 'KT134: map KT125 case-state route syntax read-only' || exit 0
          git pull --rebase origin kt134-auto-mode-isolated
          git push origin HEAD:kt134-auto-mode-isolated
