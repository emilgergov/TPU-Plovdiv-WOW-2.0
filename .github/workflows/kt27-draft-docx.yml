name: KT27 Draft two DOCX files
on:
  push:
    branches:
      - work/v27-kt26-five-packages
    paths:
      - 'v26-test/v27-preview/kt27-*'
      - 'v26-test/v27-preview/kt30-*'
      - 'v26-test/v27-preview/kt31-*'
      - 'v26-test/v27-preview/kt32-*'
      - 'v26-test/v27-preview/kt33-*'
      - 'v26-test/v27-preview/kt34-*'
      - 'v26-test/v27-preview/kt35-*'
      - '.github/workflows/kt27-draft-docx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v26-test/templates
            v26-test/v27-preview
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-docx Pillow
      - name: Inspect canonical A template
        run: python v26-test/v27-preview/kt27-inspect-template.py
      - name: Build review Word files
        run: |
          mkdir -p out
          if [ -f v26-test/v27-preview/kt27-build-docx.py ]; then python v26-test/v27-preview/kt27-build-docx.py; fi
          python v26-test/v27-preview/kt27-canonical-variant-a.py
          python v26-test/v27-preview/kt30-approved-classic-a.py
          python v26-test/v27-preview/kt31-classic-admin-layout.py
          python v26-test/v27-preview/kt32-classic-intro-paragraph.py
          python v26-test/v27-preview/kt33-approved-classic-a.py
          python v26-test/v27-preview/kt34-classic-zoos-emphasis.py
          python v26-test/v27-preview/kt35-classic-single-justified.py
      - uses: actions/upload-artifact@v4
        with:
          name: KT35-Classic-Word
          path: out/01A_Obrazec_A_KLASICHESKI_KT35.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KT34-Classic-Word
          path: out/01A_Obrazec_A_KLASICHESKI_KT34.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KT33-Classic-Word
          path: out/01A_Obrazec_A_KLASICHESKI_KT33.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KT32-Classic-Word
          path: out/01A_Obrazec_A_KLASICHESKI_KT32.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KT31-Classic-Word
          path: out/01A_Obrazec_A_KLASICHESKI_KT31.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KT27-two-Word-documents
          path: out/*.docx
          if-no-files-found: warn
