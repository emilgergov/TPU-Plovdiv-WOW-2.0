name: KT126 registry targeted verification
on:
  push:
    branches: [work/kt125-access-register-from-kt124-r6]
    paths: ['cloudflare/kt125-access/src/kt126/**','cloudflare/kt125-access/test/kt126-*.mjs','cloudflare/kt125-access/src/local-auth/**','cloudflare/ai-author-v27/src/worker.js','cloudflare/ai-author-v27/test/kt126-*.mjs','cloudflare/kt125-access/test/author-origin.test.mjs','.github/workflows/kt126-registry.yml']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare/kt125-access
      - name: Verify real D1 registry, private files, documents and revoked sessions
        working-directory: cloudflare/kt125-access
        run: node test/kt126-registry.test.mjs
      - name: Verify exact module overlays and Word metadata
        working-directory: cloudflare/kt125-access
        run: node test/kt126-gateway.test.mjs
      - name: Verify authenticated registry RPC and existing password lifecycle
        working-directory: cloudflare/kt125-access
        run: |
          node_modules/.bin/esbuild src/local-auth/service.mjs --bundle --platform=neutral --format=esm --target=es2022 '--external:node:*' '--external:cloudflare:*' --outfile=../../../dist/kt126-runtime.mjs
          KT125_RUNTIME_BUNDLE="$GITHUB_WORKSPACE/dist/kt126-runtime.mjs" node test/local-auth-runtime.test.mjs
      - name: Prove preserved R6 author logic and private confirmed-number boundary
        run: |
          git fetch origin 1e949e654f9d002f51f7e0b0e8629a78f43512d1 --depth=1
          node cloudflare/kt125-access/test/author-origin.test.mjs
          node cloudflare/ai-author-v27/test/kt126-registry-reference.mjs
          node cloudflare/ai-author-v27/test/kt123-stage4-stage5-coherence.mjs
          node cloudflare/ai-author-v27/test/kt124-independent-expert-handoff.mjs
