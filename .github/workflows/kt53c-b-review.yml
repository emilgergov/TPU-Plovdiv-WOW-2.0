name: KT53-C B review route without A regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kt53c-b-review.yml'
      - 'v26-test/v27-preview/kt53c-b-review-word.js'
      - 'v26-test/v27-preview/kt53c-b-review-test.html'
      - 'v26-test/v27-preview/kt53c-b-review-regression.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  word-a-b-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOCX regression dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Validate historical Word source is unchanged
        run: |
          node --check v26-test/v27-preview/v27-kt50-original-kt42.js
          node --check v26-test/v27-preview/kt53c-b-review-word.js
          node --check v26-test/v27-preview/kt53c-b-review-regression.cjs
          node v26-test/v27-preview/kt50-original-kt42-regression.cjs
      - name: Run A and B real DOCX regression
        run: node v26-test/v27-preview/kt53c-b-review-regression.cjs
      - name: Ensure isolated test loader uses historical ZIP and B-only source
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('v26-test/v27-preview/kt53c-b-review-test.html').read_text()
          assert 'kt53c-b-review-word.js?v=kt53c-b-only-1' in html
          assert 'kt53-original-draft-package.js?v=kt53c-original-package-1' in html
          assert 'v27-kt51-admin-only.js' not in html
          original=Path('v26-test/v27-preview/v27-kt50-original-kt42.js').read_text()
          candidate=Path('v26-test/v27-preview/kt53c-b-review-word.js').read_text()
          assert "if(k==='A'&&" in candidate
          assert 'KT53-C: B-only review route' in candidate
          assert len(candidate)>len(original)
          print('KT53-C isolated HTML and B-only source PASS')
          PY
