name: KT134 isolated automatic-mode unit tests
on:
  push:
    branches:
      - kt134-auto-mode-isolated
    paths:
      - 'kt134-auto/**'
      - '.github/workflows/kt134-auto-unit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-production-side-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse isolated modules
        run: |
          node --check kt134-auto/kt134-auto-contract.mjs
          node --check kt134-auto/kt134-auto-processor.mjs
      - name: Install isolated DOCX test dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund fflate@0.8.2 jsdom@26.1.0
      - name: Unit and actual ZIP/DOCX tests with synthetic dossiers only
        run: node --test kt134-auto/*.test.mjs
      - name: Verify isolated D1 schema against real SQLite constraints
        run: python3 kt134-auto/test_draft_sqlite_schema.py
      - name: Package offline KT134 visual demo (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: KT134-AUTO-VISUAL-DEMO
          path: kt134-auto/KT134_AUTO_VISUAL_DEMO.html
          if-no-files-found: error
