name: KT134 verify trusted principal evidence shape
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-verify-principal-source.yml']
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - name: Describe verified principal and registry response contracts without case data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/tpu-plovdiv-kt125-local-auth',{headers:{authorization:'Bearer '+process.env.CF_TOKEN}});
          if(!r.ok)throw Error('WORKER_SOURCE_UNAVAILABLE');
          const s=await r.text();
          const keys=['async function caseContext','async function identity','async function registryHandler','async function readCase','async function listCases','const columns =','const accessSQL ='];
          const out=keys.map(term=>{
            const i=s.indexOf(term);
            if(i<0)return {term,found:false};
            let text=s.slice(i,i+1550);
            text=text.split('\n').slice(0,22).join('\n');
            text=text.replace(/Bearer\s+[A-Za-z0-9._-]+/g,'[REDACTED]').replace(/sk-[A-Za-z0-9._-]{12,}/g,'[REDACTED]');
            return {term,found:true,structure:text};
          });
          fs.writeFileSync('/tmp/kt134-principal.json',JSON.stringify({metadataOnly:true,out},null,2));
          console.log('Read-only trusted principal contract captured');
          NODE
      - name: Save code contracts metadata
        run: |
          p='kt134-auto/KT134_TRUSTED_PRINCIPAL_SOURCE.json'
          enc="$(base64 -w0 /tmp/kt134-principal.json)"
          for n in 1 2 3 4; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$p?ref=kt134-auto-mode-isolated" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$p" -f content="$enc" -f sha="$sha" -f branch=kt134-auto-mode-isolated -f message='KT134: trusted server-principal source contract' >/dev/null && exit 0
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$p" -f content="$enc" -f branch=kt134-auto-mode-isolated -f message='KT134: trusted server-principal source contract' >/dev/null && exit 0
            fi
            sleep 2
          done
          exit 1
