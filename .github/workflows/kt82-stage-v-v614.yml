name: WOW · Пакет В · Работен документ V61.4
on:
  push:
    paths:
      - 'kt80/integration/kt83-v614-review-document.mjs'
      - 'kt80/integration/kt83-v614-legal-review-preview.mjs'
      - 'kt80/integration/kt83-v614-review-document.test.mjs'
      - 'kt80/KT82_23_STAGE_V_V614_REVIEW_DRAFT_TEST.html'
      - '.github/workflows/kt82-stage-v-v614.yml'
  pull_request:
    paths:
      - 'kt80/integration/kt83-v614-review-document.mjs'
      - 'kt80/integration/kt83-v614-legal-review-preview.mjs'
      - 'kt80/integration/kt83-v614-review-document.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check kt80/integration/kt83-v614-review-document.mjs
          node --check kt80/integration/kt83-v614-legal-review-preview.mjs
          node --check kt80/integration/kt83-v614-review-document.test.mjs
      - name: Document and normative safety regression
        run: |
          node --test kt80/integration/kt83-v614-review-document.test.mjs
          node --test kt80/integration/kt83-v613-competence-gate.test.mjs
          node --test kt80/integration/kt83-v612-independent-rule-packet.test.mjs
          node --test kt80/integration/kt83-v611-case-bound-b2.test.mjs
