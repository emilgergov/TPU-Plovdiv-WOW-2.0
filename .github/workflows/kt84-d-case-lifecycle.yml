name: KT84-D isolated case-cycle lifecycle browser test
on:
  push:
    branches: [kt83-vt01-automatic-route-p1]
    paths:
      - 'tests/kt84-d-case-lifecycle-browser.mjs'
      - '.github/workflows/kt84-d-case-lifecycle.yml'
      - 'kt80/KT83_WORKFLOW_CASE_V591.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kt84-d-http.log 2>&1 &
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:8765/kt80/KT83_VT02_P1_P6_VISUAL_TEST.html >/dev/null && break; sleep 1; done
      - name: Verify unique case and reject old delayed intake after reset
        run: node tests/kt84-d-case-lifecycle-browser.mjs
