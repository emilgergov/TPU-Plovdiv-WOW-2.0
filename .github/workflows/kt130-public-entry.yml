name: KT130 public V27.36 entry verification
on:
  push:
    branches: [main, work/kt125-access-register-from-kt124-r6]
    paths:
      - index.html
      - checks/kt130-public-entry.mjs
      - .github/workflows/kt130-public-entry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      contents: read
    steps:
      - name: Request a build from the configured Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type, source}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status, url}'
      - name: Verify KT133 on the live public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 15 "https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/?verify=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/wow-public.html" &&
              grep -Fq 'kt133-tpu-plovdiv-kt125-local-auth.emilgergov.workers.dev/auth/login' "$RUNNER_TEMP/wow-public.html" &&
              grep -Fq 'class="doclinks expert-version-list"' "$RUNNER_TEMP/wow-public.html"; then
              echo "Live GitHub Pages serves the KT133 entry and the Block 06 version list."
              exit 0
            fi
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '{status, commit, error}' || true
            sleep 10
          done
          echo "::error::The public site did not serve the KT133 entry within the verification window."
          exit 1
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser verification
        run: |
          mkdir -p "$RUNNER_TEMP/kt130-browser"
          npm install --prefix "$RUNNER_TEMP/kt130-browser" --no-save playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KT130_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/kt130-browser/node_modules/.bin/playwright" install chromium
          fi
      - name: Verify publication candidate in desktop and mobile Chrome
        env:
          KT130_BROWSER_PACKAGE: ${{ runner.temp }}/kt130-browser/node_modules/playwright
        run: node checks/kt130-public-entry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kt130-public-entry-visual-check
          path: kt130-public-qa
          retention-days: 7
