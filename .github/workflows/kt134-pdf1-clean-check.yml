name: KT134 clean PDF1 evidence regression
on:
  push:
    branches:
      - work/kt134-pdf1-clean-integration-20261122
    paths:
      - 'KT134/integration/**'
      - '.github/workflows/kt134-pdf1-clean-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf1-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check KT134/integration/KT82_A_PDF1_V600_KT134_CANDIDATE.js
      - run: node KT134/integration/KT82_A_PDF1_V600_KT134_CANDIDATE.test.cjs
      - name: Confirm no production changes
        run: |
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -v -E '^KT134/integration/|^\.github/workflows/kt134-pdf1-clean-check\.yml$'; then
            echo 'ERROR: unrelated change'
            exit 1
          fi
