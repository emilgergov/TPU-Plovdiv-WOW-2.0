name: KT83 P5 single administrative route
on:
  push:
    branches: [kt83-vt01-automatic-route-p1]
    paths:
      - kt80/integration/kt83-p5-single-route.js
      - kt80/integration/kt83-p5-single-route-binding.js
      - kt80/integration/kt83-p5-expert-v11-review.mjs
      - kt80/integration/kt83-p5-expert-review-ui.mjs
      - kt80/integration/kt83-vt01-route-binding.js
      - kt80/KT83_VT01_P1_AUTOMATIC_ROUTE_TEST.html
      - tests/kt83-p5-single-route.test.cjs
      - tests/kt83-p5-expert-v11-review.test.mjs
      - .github/workflows/kt83-p5-single-route.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  single-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify case identity, conditional GIS/PDF1, V11 and no stage5 loop
        run: node --test tests/kt83-p5-single-route.test.cjs tests/kt83-p5-expert-v11-review.test.mjs
