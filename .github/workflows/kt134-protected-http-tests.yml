name: KT134 protected interface-to-EG integration checks
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths:
      - 'kt134-auto/kt134-protected-http-integration.mjs'
      - 'kt134-auto/kt134-protected-http-integration.test.mjs'
      - 'kt134-auto/kt134-native-dossier-adapter.mjs'
      - 'kt134-auto/kt134-native-dossier-adapter.test.mjs'
      - 'kt134-auto/kt134-kt125-session-verifier.mjs'
      - 'kt134-auto/kt134-kt125-session-verifier.test.mjs'
      - 'kt134-auto/kt134-normative-master-adapter.mjs'
      - 'kt134-auto/kt134-normative-master-adapter.test.mjs'
      - 'kt134-auto/kt134-protected-host.mjs'
      - '.github/workflows/kt134-protected-http-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-protected-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and authentication boundary
        id: checks
        continue-on-error: true
        run: |
          node --check kt134-auto/kt134-protected-http-integration.mjs
          node --test kt134-auto/kt134-protected-http-integration.test.mjs
          node --test kt134-auto/kt134-native-dossier-adapter.test.mjs
          node --test kt134-auto/kt134-kt125-session-verifier.test.mjs
          node --test kt134-auto/kt134-normative-master-adapter.test.mjs
          node --check kt134-auto/kt134-protected-host.mjs
          node --test kt134-auto/kt134-eg-stage45-live-bridge.test.mjs
      - name: Record real test result on isolated branch
        if: always()
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("kt134-auto/KT134_PROTECTED_INTEGRATION_TEST_RESULT.json",JSON.stringify({runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,passed:process.env.CHECKS_OUTCOME==="success",outcome:process.env.CHECKS_OUTCOME,kind:"synthetic_contract_tests_only",realDossierProcessed:false,publicIntegrationDeployed:false,productionChanged:false},null,2)+"\\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kt134-auto/KT134_PROTECTED_INTEGRATION_TEST_RESULT.json
          git commit -m 'KT134: verified isolated secure dossier unit tests' || exit 0
          git pull --rebase origin kt134-auto-mode-isolated
          git push origin HEAD:kt134-auto-mode-isolated
          test "$CHECKS_OUTCOME" = success
