name: KT134 isolated GIS contract checks

on:
  push:
    branches:
      - work/kt134-gis-pdf1-panel15-isolated
    paths:
      - 'KT134/**'
      - '.github/workflows/kt134-isolated-gis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GIS evidence contract
        run: node KT134/tests/gis-contract.test.cjs
      - name: Stage 3 handoff contract
        run: node KT134/tests/stage3-handoff.test.cjs
      - name: Assert production entry is not modified by this branch
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -v -E '^KT134/|^\.github/workflows/kt134-isolated-gis\.yml$'; then
            echo 'Unexpected changes outside KT134!'
            exit 1
          fi
