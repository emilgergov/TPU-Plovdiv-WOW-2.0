name: KT128 current author failure diagnostic
on:
  push:
    branches: [work/kt125-access-register-from-kt124-r6]
    paths: ['.github/workflows/kt128-author-status.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read sanitized status for the current acceptance case only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/90df5489417e4b53179a852c446aeed1',headers={Authorization:'Bearer '+process.env.CF_TOKEN};
          const settings=await fetch(base+'/workers/scripts/tpu-plovdiv-kt125-local-auth/settings',{headers}).then(r=>r.json());if(!settings.success)throw Error('Settings unavailable');
          const id=settings.result.bindings.find(b=>b.name==='KT125_DB'&&b.type==='d1')?.id;if(!id)throw Error('Registry unavailable');
          const sql="SELECT o.endpoint,o.status,o.response_status,json_extract(o.response_json,'$.error') AS error,json_extract(o.response_json,'$.providerStatus') AS provider_status,o.created_at_ms FROM kt126_operations o JOIN kt126_registry r USING(case_id) WHERE r.organization_id=? AND r.internal_number=? ORDER BY o.created_at_ms DESC LIMIT 5";
          const result=await fetch(base+'/d1/database/'+id+'/query',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({sql,params:['riosv-plovdiv','EG-2026-000007']})}).then(r=>r.json());if(!result.success)throw Error('Status query failed');
          console.log('KT128_AUTHOR_STATUS '+JSON.stringify(result.result[0]?.results||[]));
          NODE
