name: V27 AI Author contract
on:
  push:
    paths:
      - 'v26-test/v27-*.js'
      - 'v26-test/v27-contract-test.cjs'
      - 'v26-test/v27-ai-client-contract.test.cjs'
      - 'v26-test/v26-expert-draft.js'
      - 'v26-test/v26-expert-word.js'
      - 'v26-test/v26-draft-package.js'
      - 'v26-test/index.html'
      - '.github/workflows/v27-ai-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live Worker health and authentication boundary (no paid request)
        shell: bash
        run: |
          set -euo pipefail
          base="https://tpu-plovdiv-ai-author-v27.emilgergov.workers.dev"
          health="$(curl --fail --silent --show-error --retry 2 --max-time 15 "$base/health")"
          HEALTH_JSON="$health" node -e 'const d=JSON.parse(process.env.HEALTH_JSON);if(d.status!=="online"||d.service!=="TPU Plovdiv AI Author V27")process.exit(1);console.log("Worker online; AI configured:",Boolean(d.aiGenerationEnabled));'
          status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' -X POST "$base/author" -H 'Content-Type: application/json' --data '{"mode":"expert","facts":{"subject":"Synthetic test only","parcelIds":["99999.999.9999"]}}')"
          echo "Unauthenticated endpoint HTTP: $status"
          [[ "$status" == "401" || "$status" == "503" ]] || exit 1
      - name: V27 AI author data contract
        run: |
          node v26-test/v27-contract-test.cjs
          node v26-test/v27-ai-client-contract.test.cjs
