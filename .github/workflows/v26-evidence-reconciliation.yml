name: V26 evidence reconciliation
on:
  push:
    branches:
      - work/v26-auto-word-evidence-20261028
    paths:
      - 'expert-v26/v26-dossier-evidence.js'
      - 'expert-v26/tests/evidence-reconciliation.cjs'
      - '.github/workflows/v26-evidence-reconciliation.yml'
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evidence reconciliation regression
        run: node expert-v26/tests/evidence-reconciliation.cjs
