name: V26.8 isolated browser preview package
on:
  push:
    branches:
      - work/v26-8-word-content-20261030
    paths:
      - 'v26-test/**'
      - '.github/workflows/v26-8-browser-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone expert module entrypoint
        run: |
          test -s v26-test/index.html
          test -s v26-test/v26-draft-package.js
          test -s v26-test/v26-template-word.js
          test -s v26-test/v26-expert-word.js
      - name: Package independent browser preview without changing public Pages
        uses: actions/upload-artifact@v4
        with:
          name: V26-8-browser-preview
          path: v26-test/
          if-no-files-found: error
          retention-days: 14
