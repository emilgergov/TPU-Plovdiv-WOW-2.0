name: Recovery presentation validation
on:
  push:
    branches:
      - recovery/presentation-20261018
  workflow_dispatch:
jobs:
  recovery-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run stable version tests including Tera video
        run: node tests/wow-navigation.mjs
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-navigation-results
          path: wow-test-results/
          if-no-files-found: ignore
