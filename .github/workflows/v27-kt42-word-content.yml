name: V27 KT42 approved Word content lock
on:
  push:
    paths:
      - '.github/workflows/v27-kt42-word-content.yml'
      - 'v26-test/v27-preview/kt42-approved-word-regression.cjs'
      - 'v26-test/v27-preview/v27-kt41-etalon-bridge.js'
      - 'v26-test/v27-preview/v26-draft-package.js'
      - 'v26-test/v27-preview/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  approved-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone DOCX test dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8
      - name: Validate JS syntax
        run: |
          node --check v26-test/v27-preview/v27-kt41-etalon-bridge.js
          node --check v26-test/v27-preview/v26-draft-package.js
          node --check v26-test/v27-preview/kt42-approved-word-regression.cjs
      - name: Compare generated Word against all three approved originals
        run: node v26-test/v27-preview/kt42-approved-word-regression.cjs
      - name: Publish verified CI marker for the isolated Pages preview
        if: success()
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          marker=Path('v26-test/v27-preview/KT42_VERIFIED.json')
          marker.write_text(json.dumps({'checkpoint':'KT42','verified_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tests':'DOCX original paragraph preservation A, B and R02: PASS','status':'verified-for-preview'},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v26-test/v27-preview/KT42_VERIFIED.json
          git commit -m "KT42: mark exact Word etalons verified by executable DOCX test"
          git push
