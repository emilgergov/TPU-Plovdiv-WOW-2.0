name: V27 KT47 locked user-approved DOCX regression
on:
  push:
    paths:
      - '.github/workflows/v27-kt42-word-content.yml'
      - 'v26-test/v27-preview/kt42-approved-word-regression.cjs'
      - 'v26-test/v27-preview/etalon/**'
      - 'v26-test/v27-preview/v27-kt41-etalon-bridge.js'
      - 'v26-test/v27-preview/v26-draft-package.js'
      - 'v26-test/v27-preview/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  approved-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact user-approved A/B/E DOCX and run cross-case Word regression
        run: |
          set +e
          {
            echo "== dependency installation =="
            npm install --no-save --ignore-scripts --no-package-lock fflate@0.8.2 @xmldom/xmldom@0.9.8 || exit 11
            echo "== JS syntax =="
            node --check v26-test/v27-preview/v27-kt41-etalon-bridge.js || exit 12
            node --check v26-test/v27-preview/v26-draft-package.js || exit 13
            node --check v26-test/v27-preview/kt42-approved-word-regression.cjs || exit 14
            echo "== three approved templates, two scenarios, full place headings =="
            node v26-test/v27-preview/kt42-approved-word-regression.cjs || exit 15
          } > /tmp/kt43_regression.txt 2>&1
          status=$?
          cat /tmp/kt43_regression.txt
          echo "$status" > /tmp/kt43_status.txt
          exit "$status"
      - name: Record test diagnostics in GitHub
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/kt43_regression.txt v26-test/v27-preview/KT43_REGRESSION_DIAGNOSTICS.txt 2>/dev/null || printf 'Failure before regression stage\n' > v26-test/v27-preview/KT43_REGRESSION_DIAGNOSTICS.txt
          printf '\nExit code: ' >> v26-test/v27-preview/KT43_REGRESSION_DIAGNOSTICS.txt
          cat /tmp/kt43_status.txt >> v26-test/v27-preview/KT43_REGRESSION_DIAGNOSTICS.txt 2>/dev/null || echo 'unknown' >> v26-test/v27-preview/KT43_REGRESSION_DIAGNOSTICS.txt
          git add v26-test/v27-preview/KT43_REGRESSION_DIAGNOSTICS.txt
          git commit -m "KT47: record integrated Word regression diagnostic" || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Diagnostic push retry $attempt"
            sleep 3
          done
      - name: Publish KT47 verified CI marker
        if: success()
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          marker=Path('v26-test/v27-preview/KT47_VERIFIED.json')
          marker.write_text(json.dumps({'checkpoint':'KT47','verified_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tests':'Exact user-approved A/B/R02 binary hashes + layout, metadata and GIS checks: PASS','status':'verified-for-preview'},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v26-test/v27-preview/KT47_VERIFIED.json
          git commit -m "KT47: verified A+B/Expert legal content and EKATTE sources with executable regression" || true
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            echo "Verified marker push retry $attempt"
            sleep 3
          done
          test "$pushed" -eq 1
