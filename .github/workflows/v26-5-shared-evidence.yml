name: V26.5 shared evidence checks
on:
  push:
    branches:
      - work/v26-auto-word-evidence-20261028
  workflow_dispatch:
jobs:
  shared-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V26.5 shared evidence regression
        run: node expert-v26/tests/v26-5-shared-evidence.test.cjs
