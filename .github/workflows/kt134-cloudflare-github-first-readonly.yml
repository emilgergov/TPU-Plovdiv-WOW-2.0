name: KT134 — GitHub-first Cloudflare capability audit (read only)
# Safe branch-only GET audit. No deployment, migrations, or production mutations.
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-cloudflare-github-first-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref_name == 'kt134-auto-mode-isolated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check isolated source and test contracts
        uses: actions/checkout@v4
      - name: Validate isolated module syntax
        run: |
          set -euo pipefail
          for file in kt134-auto/*.mjs; do node --check "$file"; done
      - name: Confirm Cloudflare token and protected KT125 resource capability (READ ONLY)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
          CF_KT125_GATEWAY: kt133-tpu-plovdiv-kt125-local-auth
          CF_TEST_WORKER: ${{ vars.KT134_TEST_WORKER_NAME }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::GitHub secret CLOUDFLARE_API_TOKEN missing"; exit 1; }
          echo "::add-mask::$CF_TOKEN"
          # All Cloudflare operations below are GET only. Never print source, credentials, or binding names/values.
          call() {
            local path="$1" out="$2" status
            status=$(curl --silent --show-error --max-time 25 -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/$path")
            echo "Read-only endpoint HTTP status: $status"
            if [ "$status" != 200 ]; then echo "::error::Cloudflare metadata read failed"; return 1; fi
          }
          # Probe both independent GET endpoints even if token verification returns
          # HTTP 401. This distinguishes account authorization from token status.
          token_status=$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/kt134-token.json" -w '%{http_code}' \
             -H "Authorization: Bearer $CF_TOKEN" \
             -H 'Accept: application/json' \
             "https://api.cloudflare.com/client/v4/user/tokens/verify")
          settings_status=$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/kt134-gateway.json" -w '%{http_code}' \
             -H "Authorization: Bearer $CF_TOKEN" \
             -H 'Accept: application/json' \
             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$CF_KT125_GATEWAY/settings")
          echo "Token verify GET HTTP: $token_status"
          echo "Protected gateway settings GET HTTP: $settings_status"
          if [ "$token_status" = 200 ]; then
            node - "$RUNNER_TEMP/kt134-token.json" <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('Cloudflare token verification succeeded:',d.success===true&&d.result?.status==='active');
          NODE
          fi
          if [ "$settings_status" = 200 ]; then
            node - "$RUNNER_TEMP/kt134-gateway.json" <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.success||!Array.isArray(d.result?.bindings))throw Error('Gateway settings invalid');
          const count={};for(const x of d.result.bindings)count[x.type]=(count[x.type]||0)+1;
          console.log('Gateway binding types only:',JSON.stringify(count));
          NODE
          fi
          # Some restricted Cloudflare tokens can read a Worker without permission
          # to call /user/tokens/verify. Do not mistake 401 here for invalidity.
          if [ "$settings_status" != 200 ]; then
             echo "::error::Cannot read protected Worker settings; current scope insufficient"
             exit 1
          fi
          if [ "$token_status" != 200 ]; then
             echo "::notice::Token verification endpoint is unavailable; protected Worker settings GET succeeded"
          fi
          # Follow the proven single service binding and inspect ONLY safe
          # binding TYPES on the backend. Never print the target service name,
          # source, secret values, database ids, case records or raw API body.
          node - "$RUNNER_TEMP/kt134-gateway.json" "$RUNNER_TEMP/kt134-service-target" <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const services=(d.result?.bindings||[]).filter(x=>x.type==='service');
          if(services.length!==1||typeof services[0].service!=='string'||
             !/^[a-z0-9_-]{3,100}$/i.test(services[0].service))
            throw Error('Expected one valid protected service binding');
          fs.writeFileSync(process.argv[3],services[0].service,{mode:0o600});
          console.log('One protected KT125 backend service discovered (name withheld)');
          NODE
          service="$(cat "$RUNNER_TEMP/kt134-service-target")"
          backend_status=$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/kt134-backend-settings.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$service/settings")
          echo "Protected backend settings GET HTTP: $backend_status"
          if [ "$backend_status" = 200 ]; then
            node - "$RUNNER_TEMP/kt134-backend-settings.json" <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.success!==true||!Array.isArray(d.result?.bindings))throw Error('Invalid protected backend response');
          const summary={};
          for(const b of d.result.bindings)summary[b.type]=(summary[b.type]||0)+1;
          console.log('Protected backend binding TYPES only:',JSON.stringify(summary));
          NODE
          else
            echo "::notice::Backend metadata not readable with current token; no protected data accessed"
          fi
          # Read the live backend source solely into private runner temp storage.
          # Output only a SHA-256, approximate source size and Boolean structural
          # markers; NEVER print the source or upload a workflow artifact.
          # Restrict the source request to GET; never activate any version.
          source_status=$(curl --silent --show-error --max-time 30 -o "$RUNNER_TEMP/kt134-backend-source" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$service")
          echo "Protected KT125 source GET HTTP: $source_status"
          if [ "$source_status" = 200 ]; then
            node - "$RUNNER_TEMP/kt134-backend-source" <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const bytes=fs.readFileSync(process.argv[2]);
          const text=bytes.toString('utf8');
          // Only safe counts/booleans. This check is not a security audit.
          const markers={
            hasCaseConfirm:text.includes('case.confirm'),
            hasCaseEdit:text.includes('case.edit'),
            hasDocumentGenerate:text.includes('document.generate'),
            hasCaseRegistry:text.includes('kt126_registry'),
            hasSqlUpdate:text.includes('UPDATE '),
            hasKt134Auto:text.includes('kt134.auto-dossier-analyze.v1'),
            hasLocalLogin:text.includes('/auth/login'),
            hasDurableObject:text.includes('DurableObject')||text.includes('durable_object')
          };
          console.log('Protected KT125 source SHA256:',crypto.createHash('sha256').update(bytes).digest('hex'));
          console.log('Protected KT125 source bytes:',bytes.length);
          console.log('Protected KT125 structural presence flags:',JSON.stringify(markers));
          console.log('Source retained only within private temporary runner storage and never printed or uploaded.');
          NODE
          else
            echo "::notice::Cannot inspect live source with current token; binding metadata remains verified"
          fi
          # Inventory only: list metadata of resources in account to see
          # whether a *separate* staging environment exists. No resource
          # names, IDs, records or configuration values in public logs.
          for kind in workers d1 r2; do
            case "$kind" in
              workers) route="accounts/$CF_ACCOUNT/workers/scripts" ;;
              d1) route="accounts/$CF_ACCOUNT/d1/database" ;;
              r2) route="accounts/$CF_ACCOUNT/r2/buckets" ;;
            esac
            status=$(curl --silent --show-error --max-time 25 \
              -o "$RUNNER_TEMP/kt134-inventory-$kind.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/$route?per_page=100")
            echo "KT134 $kind list GET HTTP: $status"
            if [ "$status" = 200 ]; then
              node - "$RUNNER_TEMP/kt134-inventory-$kind.json" "$kind" <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const kind=process.argv[3];
          if(!d.success){console.log('Inventory response not successful');process.exit(0);}
          const a=Array.isArray(d.result)?d.result:
            Array.isArray(d.result?.buckets)?d.result.buckets:[];
          const staging=a.filter(x=>{
            const name=String(x.name||x.script_name||'');
            return /(kt134|staging|stage|sandbox|test)/i.test(name)&&
                   !/(kt133|kt125|ai-author-v27)/i.test(name);
          }).length;
          console.log('KT134 '+kind+' inventory: total visible='+a.length+
            ', possible isolated staging candidates='+staging+
            ' (names/IDs withheld; pagination may limit results)');
          NODE
            else
              echo "::notice::KT134 $kind inventory unavailable under current token (not a deployment error)"
            fi
          done
          if [ -n "$CF_TEST_WORKER" ]; then
            if ! [[ "$CF_TEST_WORKER" =~ ^[a-zA-Z0-9_-]+$ ]] || [[ "$CF_TEST_WORKER" == "$CF_KT125_GATEWAY" ]] || [[ "$CF_TEST_WORKER" == "tpu-plovdiv-ai-author-v27" ]]; then
              echo "::error::Test Worker name invalid or matches production"; exit 1
            fi
            call "accounts/$CF_ACCOUNT/workers/scripts/$CF_TEST_WORKER/settings" "$RUNNER_TEMP/kt134-test.json"
            node - "$RUNNER_TEMP/kt134-test.json" <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.success||!Array.isArray(d.result?.bindings))throw Error('Test Worker resource not accessible');
          const types=[...new Set(d.result.bindings.map(x=>x.type))].sort();
          console.log('Test Worker binding types only:',types.join(', ')||'(none)');
          NODE
          else
            echo "::notice::KT134_TEST_WORKER_NAME not configured; no test Worker access proven"
          fi
      - name: Safety checkpoint
        run: |
          echo 'Read-only check completed; no deployment or D1/R2 operations were performed.'
          echo 'KT133 and the active KT125 Worker have not been modified by this workflow.'
