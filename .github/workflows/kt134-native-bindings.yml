name: KT134 native bindings verification
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-native-bindings.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - name: Verify public binding configuration only
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/tpu-plovdiv-kt125-local-auth/settings" > /tmp/b.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/b.json','utf8'));
          if(!a.success)throw Error('KT125 settings unavailable');
          const bindings=(a.result?.bindings||[]).map(x=>({name:x.name,type:x.type,service:x.service||null}));
          fs.writeFileSync('kt134-auto/KT134_KT125_BINDING_TYPES.json',JSON.stringify({bindings},null,2));
          console.log(bindings.map(x=>x.name+':'+x.type).join(', '));
          NODE
      - name: Save public binding types
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kt134-auto/KT134_KT125_BINDING_TYPES.json
          if ! git diff --cached --quiet; then
            git commit -m 'KT134: record KT125 binding types for isolated integration'
            git push origin HEAD:kt134-auto-mode-isolated
          fi
