name: KT134 stored state packing contract
on:
  push:
    branches: [kt134-auto-mode-isolated]
    paths: ['.github/workflows/kt134-kt126-state-packing-audit.yml']
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: "90df5489417e4b53179a852c446aeed1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: kt134-auto-mode-isolated}
      - name: Trace KT126 persisted state packing and unpacking
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/tpu-plovdiv-kt125-local-auth',{headers:{authorization:'Bearer '+process.env.CF_TOKEN}});
          if(!r.ok)throw Error('WORKER_SOURCE_UNAVAILABLE');
          const source=await r.text();
          const keys=['async function pack','async function unpack','function pack(','function unpack(','const pack =','const unpack =','async function save()','await pack(','await unpack(','const savedGlobals =','const fields ='];
          const out=keys.map(term=>{
            let cursor=0,hits=[];
            for(let n=0;n<10;n++){const i=source.indexOf(term,cursor);if(i<0)break;cursor=i+term.length;
             const block=source.slice(Math.max(0,i-180),i+2400);
             hits.push(block.split('\n').slice(0,32).join('\n').slice(0,2300));
            }
            return {term,hits};
          });
          fs.writeFileSync('/tmp/kt134-packing.json',JSON.stringify({codeMetadataOnly:true,out},null,2));
          console.log('Persisted state envelope analyzed');
          NODE
      - name: Save audit
        run: |
          p='kt134-auto/KT134_NATIVE_STATE_PACKING.json'
          enc="$(base64 -w0 /tmp/kt134-packing.json)"
          for n in 1 2 3 4; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$p?ref=kt134-auto-mode-isolated" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$p" -f content="$enc" -f sha="$sha" -f branch=kt134-auto-mode-isolated -f message='KT134: actual KT126 saved state packing format' >/dev/null && exit 0
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$p" -f content="$enc" -f branch=kt134-auto-mode-isolated -f message='KT134: actual KT126 saved state packing format' >/dev/null && exit 0
            fi
            sleep 2
          done
          exit 1
