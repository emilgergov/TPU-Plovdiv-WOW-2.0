<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V26 — пълна ГИС справка</title><style>body{font:16px system-ui;margin:2rem auto;max-width:950px;padding:0 1rem;background:#f6f8f5;color:#173827}main{background:white;padding:2rem;border-radius:14px}button,input,textarea{font:inherit;padding:10px;margin:6px 0}textarea{width:95%;min-height:90px}button{background:#176b42;color:white;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3ee;padding:1rem}small{color:#555}</style><main><h1>ТПУ Пловдив · ГИС V26</h1><p>Пълна локална справка от одобрената работна ГИС база. Архивът остава на Вашия компютър.</p><label>Заредете <code>V26_PREFIX_RECOVERED_2026-10-27.zip</code><br><input id="archive" type="file" accept=".zip"></label><p id="status">Очаква ГИС архив.</p><label>Кадастрални идентификатори (по един на ред)<textarea id="ids">70528.501.3068</textarea></label><button id="go" disabled>ГИС справка</button><pre id="output"></pre><small>Този диагностичен екран не замества действащата WOW 3.4.1 и не издава административно становище.</small></main><script src="v26-approved-gis-zip.js"></script><script>const $=id=>document.getElementById(id);$('archive').onchange=async()=>{try{$('status').textContent='Зареждане на архива…';const x=await V26ApprovedGIS.openArchive($('archive').files[0]);$('status').textContent='Готов: '+x.name+' · '+x.files+' файла';$('go').disabled=false}catch(e){$('status').textContent='Грешка: '+e.message}};$('go').onclick=async()=>{try{$('output').textContent='Извличане…';const r=await V26ApprovedGIS.lookup($('ids').value.split(/[\s,;]+/).filter(Boolean));$('output').textContent=JSON.stringify({summary:r.summary,results:r.results.map(x=>({cadnum:x.cadnum,status:x.status,settlement:x.settlement,locality:x.locality,area_m2_source:x.area_m2_source,parcel_polygons:x.geojson.features.length,intersection_polygons:x.overlap_geojson.features.length,zones:x.archived_overlay_records}))},null,2)}catch(e){$('output').textContent='Грешка: '+e.message}};</script></html>
